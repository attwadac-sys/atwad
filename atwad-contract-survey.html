<!doctype html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نموذج معاينة عقد صيانة — أطواد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2C5C; --gold:#C9A227; --ink:#1A2433;
  --line:#9AA8BC; --soft:#EDF2F9; --mute:#5A6B80;
}
*{box-sizing:border-box;}
body{
  margin:0; background:#5A6B80; padding:18px;
  font-family:'Tajawal',sans-serif; color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}

/* ===== شريط الأدوات — لا يُطبع ===== */
.bar{
  max-width:794px; margin:0 auto 14px; display:flex; gap:9px;
  align-items:center; flex-wrap:wrap;
}
.bar .ttl{color:#fff;font-weight:700;font-size:14px;margin-inline-end:auto;}
.btn{
  padding:9px 18px; border:0; border-radius:8px; cursor:pointer;
  font-family:'Tajawal',sans-serif; font-size:13.5px; font-weight:700;
  background:var(--gold); color:#23354C;
}
.btn.alt{background:#fff;color:var(--navy);}
.hint{color:#D8E2EF;font-size:12px;font-weight:500;width:100%;line-height:1.7;}

/* ===== الورقة ===== */
.sheet{
  width:794px; min-height:1123px; margin:0 auto 18px; background:#fff;
  padding:30px 34px 26px; position:relative;
  box-shadow:0 3px 18px rgba(0,0,0,.3);
  display:flex; flex-direction:column;
}

/* ===== الترويسة ===== */
.head{
  display:flex; align-items:flex-start; gap:14px;
  border-bottom:2.5px solid var(--navy); padding-bottom:11px; margin-bottom:13px;
}
.head .brand{margin-inline-end:auto;}
.head .org{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.3px;}
.head h1{margin:2px 0 0;font-size:22px;font-weight:900;color:var(--navy);line-height:1.25;}
.head .sub{font-size:11.5px;color:var(--mute);margin-top:3px;}
.head .meta{
  text-align:center;border:1.5px solid var(--line);border-radius:8px;
  padding:7px 12px;min-width:138px;
}
.head .meta .lbl{font-size:10px;color:var(--mute);font-weight:700;}
.head .meta .num{font-size:15px;font-weight:900;color:var(--navy);letter-spacing:1px;}
.head .meta .pg{font-size:10px;color:var(--mute);margin-top:3px;}

/* ===== الحقول ===== */
.sec{
  font-size:12.5px;font-weight:900;color:#fff;background:var(--navy);
  padding:5px 11px;border-radius:5px;margin:0 0 9px;
}
.grid{display:grid;gap:8px 14px;margin-bottom:14px;}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:1.6fr 1fr;}
.f{display:flex;flex-direction:column;gap:2px;}
.f .l{font-size:10.5px;font-weight:700;color:var(--mute);}
.f .w{border-bottom:1.2px solid var(--line);height:21px;}

/* ===== جدول الوحدات ===== */
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid var(--line);padding:0;}
thead th{
  background:var(--soft); color:var(--navy);
  font-size:9.5px; font-weight:900; line-height:1.25;
  padding:5px 2px; text-align:center;
}
tbody td{height:25px;text-align:center;font-size:11px;}
tbody tr:nth-child(even) td{background:#FAFCFF;}
td.n{background:var(--soft)!important;font-weight:900;color:var(--navy);font-size:10.5px;width:26px;}

/* ===== المفتاح ===== */
.key{
  margin-top:9px;border:1px dashed var(--line);border-radius:7px;
  padding:7px 11px;font-size:10.5px;color:var(--mute);line-height:1.85;
}
.key b{color:var(--navy);}

/* ===== الخلاصة ===== */
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px;}
.box{border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;}
.box .l{font-size:10px;color:var(--mute);font-weight:700;}
.box .v{height:27px;border-bottom:1.2px solid var(--line);margin-top:4px;}
.lines{border:1.5px solid var(--line);border-radius:8px;padding:9px 12px 4px;margin-bottom:13px;}
.lines .ln{border-bottom:1.2px solid #C9D4E2;height:25px;}
.lines .ln:last-child{border-bottom:0;}

.verdict{display:flex;gap:9px;margin-bottom:14px;}
.vd{
  flex:1;border:1.5px solid var(--line);border-radius:8px;
  padding:9px 10px;display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;color:var(--ink);
}
.tick{width:16px;height:16px;border:1.6px solid var(--navy);border-radius:3px;flex:0 0 auto;}

/* ===== التوقيعات ===== */
.sign{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:auto;padding-top:8px;}
.sign .s .l{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:16px;}
.sign .s .w{border-bottom:1.4px solid var(--ink);}
.sign .s .n{font-size:10px;color:var(--mute);margin-top:4px;}

.foot{
  margin-top:11px;border-top:1px solid #D4DEEA;padding-top:7px;
  display:flex;justify-content:space-between;font-size:10px;color:var(--mute);
}

/* ===== الطباعة ===== */
@page{size:A4 portrait;margin:9mm;}
@media print{
  body{background:#fff;padding:0;}
  .bar{display:none;}
  .sheet{
    width:auto;min-height:auto;margin:0;padding:0;
    box-shadow:none;page-break-after:always;
  }
  .sheet:last-child{page-break-after:auto;}
}
</style>
</head>
<body>

<div class="bar">
  <span class="ttl" data-t="barTitle"></span>
  <button class="btn" onclick="window.print()" data-t="btnPrint"></button>
  <button class="btn alt" onclick="addRows()" data-t="btnAdd"></button>
  <button class="btn alt" onclick="toggleLang()" id="langBtn"></button>
  <p class="hint" data-t="hint"></p>
</div>

<!-- ══════════ الورقة الأولى ══════════ -->
<div class="sheet">

  <div class="head">
    <div class="brand">
      <div class="org" data-t="org"></div>
      <h1 data-t="title1"></h1>
      <div class="sub" data-t="sub1"></div>
    </div>
    <div class="meta">
      <div class="lbl" data-t="surveyNo"></div>
      <div class="num">—————</div>
      <div class="pg" data-t="page1"></div>
    </div>
  </div>

  <div class="sec" data-t="sec1"></div>
  <div class="grid g3">
    <div class="f"><span class="l" data-t="company"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="activity"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="cr"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="contact"></span><span class="w"></span></div>

    <div class="f"><span class="l" data-t="mobile"></span><span class="w"></span></div>

  <div class="sec" data-t="sec2"></div>
  <div class="grid g3">
    <div class="f"><span class="l" data-t="district"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="bldg"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="floors"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="sdate"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="tech"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="hours"></span><span class="w"></span></div>
  </div>

  <div class="sec" data-t="sec3"></div>
  <table><thead></thead><tbody id="tb1"></tbody></table>

  <div class="key" data-t="key"></div>

    <span data-t="footOrg"></span>

<!-- ══════════ الورقة الثانية ══════════ -->
<div class="sheet">

  <div class="head">
    <div class="brand">
      <div class="org" data-t="org"></div>
      <h1 data-t="title2"></h1>
      <div class="sub" data-t="sub2"></div>
    </div>
    <div class="meta">
      <div class="lbl" data-t="surveyNo"></div>
      <div class="num">—————</div>
      <div class="pg" data-t="page2"></div>
    </div>
  </div>

  <table><thead></thead><tbody id="tb2"></tbody></table>

  <div class="sec" style="margin-top:14px;" data-t="sec4"></div>
  <div class="boxes">
    <div class="box"><div class="l" data-t="total"></div><div class="v"></div></div>
    <div class="box"><div class="l" data-t="good"></div><div class="v"></div></div>
    <div class="box"><div class="l" data-t="service"></div><div class="v"></div></div>
    <div class="box"><div class="l" data-t="replace"></div><div class="v"></div></div>
  </div>

  <div class="sec" data-t="sec5"></div>
  <div class="lines"><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>

  <div class="sec" data-t="sec6"></div>
  <div class="lines"><div class="ln"></div><div class="ln"></div></div>

  <div class="sec" data-t="sec7"></div>
  <div class="verdict">
    <div class="vd"><span class="tick"></span><span data-t="v1"></span></div>
    <div class="vd"><span class="tick"></span><span data-t="v2"></span></div>
    <div class="vd"><span class="tick"></span><span data-t="v3"></span></div>
  </div>

  <div class="grid g2">
    <div class="f"><span class="l" data-t="freq"></span><span class="w"></span></div>
    <div class="f"><span class="l" data-t="crew"></span><span class="w"></span></div>
  </div>

  <div class="sign">
    <div class="s">
      <div class="l" data-t="signTech"></div>
      <div class="w"></div>
      <div class="n" data-t="signTechN"></div>
    </div>
    <div class="s">
      <div class="l" data-t="signClient"></div>
      <div class="w"></div>
      <div class="n" data-t="signClientN"></div>
    </div>
  </div>

  <div class="foot">
    <span data-t="disclaimer"></span>
    <span data-t="page2"></span>
  </div>
</div>

<script>
/* ============================================================
   النموذج ثنائي اللغة. كل نص مرئي يحمل data-t ويُملأ من القاموس،
   فلا توجد نسخة ثانية من الملف تُنسى عند أي تعديل لاحق.
   ?lang=en يفتحه بالإنجليزية مباشرة، والزرّ يبدّل بلا إعادة تحميل.
   ============================================================ */
var T = {
  ar: {
    htmlLang:'ar', dir:'rtl', docTitle:'نموذج معاينة عقد صيانة — أطواد',
    barTitle:'نموذج معاينة عقد صيانة',
    btnPrint:'🖨️ طباعة', btnAdd:'➕ صفحة وحدات إضافية', langBtn:'🌐 English',
    hint:'ورقتان: الأولى بيانات الجهة وجدول ١٨ وحدة، والثانية ١٢ وحدة إضافية مع الخلاصة والتوقيع. ' +
         'إن زادت وحدات الموقع عن ٣٠، أضيفي صفحة بالزر أعلاه قبل الطباعة.',
    org:'مؤسسة أطواد لصيانة المكيفات',
    title1:'نموذج معاينة ما قبل عقد الصيانة',
    sub1:'يُعبَّأ في الموقع قبل إصدار عرض السعر — ولا يُعتدّ بأي بند لم يُدوَّن هنا',
    title2:'تتمّة الحصر · الخلاصة والتوصية',
    sub2:'الجهة: ————————————————&nbsp;&nbsp;&nbsp;التاريخ: ——————————',
    surveyNo:'رقم المعاينة', page1:'صفحة ١ من ٢', page2:'صفحة ٢ من ٢',
    sec1:'١ · بيانات الجهة',
    company:'اسم الجهة / الشركة', activity:'النشاط', cr:'السجل التجاري / الرقم الضريبي',
    contact:'اسم المسؤول', position:'الصفة', mobile:'الجوال',
    sec2:'٢ · الموقع والمعاينة',
    district:'الحي', bldg:'نوع المبنى (مكتب · محل · مستودع · سكن)', floors:'عدد الأدوار / الفروع',
    sdate:'تاريخ المعاينة', tech:'اسم الفني المعاين', hours:'ساعات دخول الفنيين المسموحة',
    sec3:'٣ · حصر الوحدات وحالتها',
    cols:['م','الموقع / الغرفة','النوع','الماركة','القدرة','سنة<br>التركيب',
          'الوحدة<br>الداخلية','الوحدة<br>الخارجية','كفاءة<br>التبريد','الغاز','التصريف','الضجيج',
          'عمل مطلوب قبل العقد'],
    key:'<b>مفتاح التقييم:</b> اكتب في الخانة <b>١</b> سليم · <b>٢</b> يحتاج صيانة · <b>٣</b> يحتاج استبدال. ' +
        '&nbsp;|&nbsp; <b>النوع:</b> سبليت · شباك · كونسيلد · دولابي · مركزي. ' +
        '&nbsp;|&nbsp; <b>الغاز:</b> طبيعي / ناقص. ' +
        '&nbsp;|&nbsp; <b>التصريف:</b> سليم / مسدود / يسرّب.' +
        '<br><b>تنبيه للفني:</b> كل وحدة تُقيَّم <b>٣</b> تُستثنى من العقد وتُسعَّر منفصلة — ' +
        'ولا تُدرَج ضمن الصيانة الدورية.',
    footOrg:'مؤسسة أطواد لصيانة المكيفات · 0509720382',
    sec4:'٤ · الخلاصة العددية',
    total:'إجمالي الوحدات', good:'سليمة (١)', service:'تحتاج صيانة (٢)', replace:'تحتاج استبدال (٣)',
    sec5:'٥ · أعمال لازمة قبل بدء العقد',
    sec6:'٦ · ملاحظات الفني وصعوبات الوصول',
    sec7:'٧ · التوصية',
    v1:'صالح للعقد مباشرة', v2:'صالح بعد تنفيذ الأعمال أعلاه', v3:'غير صالح حالياً',
    freq:'دورية الزيارات المقترحة', crew:'عدد الفنيين لكل زيارة',
    signTech:'الفني المعاين', signTechN:'الاسم والتوقيع والتاريخ',
    signClient:'ممثل الجهة', signClientN:'الاسم والتوقيع والختم',
    disclaimer:'هذا النموذج معاينة فنية ولا يُعدّ عرض سعر ولا التزاماً تعاقدياً',
    extraTitle:'تتمّة حصر الوحدات', extraPg:'ورقة إضافية '
  },
  en: {
    htmlLang:'en', dir:'ltr', docTitle:'Pre-Contract AC Survey Form — Atwad',
    barTitle:'Pre-Contract AC Survey Form',
    btnPrint:'🖨️ Print', btnAdd:'➕ Extra units page', langBtn:'🌐 عربي',
    hint:'Two pages: client details and 18 units on page one; 12 further units plus summary and ' +
         'signatures on page two. For sites with more than 30 units, add a page before printing.',
    org:'Atwad Air Conditioning Maintenance',
    title1:'Pre-Contract Air Conditioning Survey',
    sub1:'To be completed on site before a quotation is issued — anything not recorded here is not included',
    title2:'Inventory continued · Summary &amp; Recommendation',
    sub2:'Client: ————————————————&nbsp;&nbsp;&nbsp;Date: ——————————',
    surveyNo:'Survey No.', page1:'Page 1 of 2', page2:'Page 2 of 2',
    sec1:'1 · Client Details',
    company:'Company / Organization', activity:'Business activity', cr:'CR / VAT number',
    contact:'Contact person', position:'Position', mobile:'Mobile',
    sec2:'2 · Site &amp; Survey',
    district:'District', bldg:'Building type (office · shop · warehouse · residential)',
    floors:'Floors / branches', sdate:'Survey date', tech:'Surveying technician',
    hours:'Permitted access hours',
    sec3:'3 · Unit Inventory &amp; Condition',
    cols:['No.','Location / Room','Type','Brand','Capacity','Year<br>installed',
          'Indoor<br>unit','Outdoor<br>unit','Cooling','Refrigerant','Drainage','Noise',
          'Work required before contract'],
    key:'<b>Rating key:</b> write <b>1</b> good · <b>2</b> needs servicing · <b>3</b> needs replacement. ' +
        '&nbsp;|&nbsp; <b>Type:</b> split · window · concealed · floor-standing · central. ' +
        '&nbsp;|&nbsp; <b>Refrigerant:</b> normal / low. ' +
        '&nbsp;|&nbsp; <b>Drainage:</b> clear / blocked / leaking.' +
        '<br><b>Note to technician:</b> any unit rated <b>3</b> is excluded from the contract and ' +
        'quoted separately — it is not covered by routine servicing.',
    footOrg:'Atwad Air Conditioning Maintenance · 0509720382',
    sec4:'4 · Summary',
    total:'Total units', good:'Good (1)', service:'Needs servicing (2)', replace:'Needs replacement (3)',
    sec5:'5 · Works required before the contract starts',
    sec6:'6 · Technician notes &amp; access constraints',
    sec7:'7 · Recommendation',
    v1:'Eligible as is', v2:'Eligible after the works above', v3:'Not eligible at present',
    freq:'Proposed visit frequency', crew:'Technicians per visit',
    signTech:'Surveying technician', signTechN:'Name, signature &amp; date',
    signClient:'Client representative', signClientN:'Name, signature &amp; stamp',
    disclaimer:'This form is a technical survey; it is neither a quotation nor a contractual commitment',
    extraTitle:'Unit inventory continued', extraPg:'Extra page '
  }
};

var LANG = (location.search.indexOf('lang=en') !== -1) ? 'en' : 'ar';
var COLS = 13;

function t(k){ return T[LANG][k]; }

function headRow(){
  var c = t('cols');
  return '<tr><th>' + c[0] + '</th>' +
    '<th style="width:15%">' + c[1] + '</th>' +
    '<th style="width:9%">'  + c[2] + '</th>' +
    '<th style="width:10%">' + c[3] + '</th>' +
    '<th style="width:7%">'  + c[4] + '</th>' +
    '<th style="width:7%">'  + c[5] + '</th>' +
    '<th>' + c[6] + '</th><th>' + c[7] + '</th><th>' + c[8] + '</th>' +
    '<th>' + c[9] + '</th><th>' + c[10] + '</th><th>' + c[11] + '</th>' +
    '<th style="width:13%">' + c[12] + '</th></tr>';
}

function buildRows(tbodyId, from, count){
  var tb = document.getElementById(tbodyId);
  if(!tb) return;
  var html = '';
  for(var i = 0; i < count; i++){
    html += '<tr><td class="n">' + (from + i) + '</td>';
    for(var c = 1; c < COLS; c++) html += '<td></td>';
    html += '</tr>';
  }
  tb.innerHTML = html;
}

function applyLang(){
  var root = document.getElementById('root');
  root.lang = t('htmlLang');
  root.dir  = t('dir');
  document.title = t('docTitle');

  var nodes = document.querySelectorAll('[data-t]');
  for(var i = 0; i < nodes.length; i++){
    nodes[i].innerHTML = t(nodes[i].getAttribute('data-t'));
  }
  var heads = document.querySelectorAll('thead');
  for(var h = 0; h < heads.length; h++) heads[h].innerHTML = headRow();

  var lb = document.getElementById('langBtn');
  if(lb) lb.textContent = t('langBtn');
}

function toggleLang(){
  LANG = (LANG === 'ar') ? 'en' : 'ar';
  applyLang();
}

applyLang();
buildRows('tb1', 1, 18);
buildRows('tb2', 19, 12);

/* صفحة وحدات إضافية للمواقع التي تتجاوز 30 وحدة — تُدرج قبل الورقة الأخيرة */
var extra = 0;
function addRows(){
  extra++;
  var start = 31 + (extra - 1) * 32;
  var sheets = document.querySelectorAll('.sheet');
  var last = sheets[sheets.length - 1];

  var s = document.createElement('div');
  s.className = 'sheet';
  s.innerHTML =
    '<div class="head"><div class="brand">' +
      '<div class="org" data-t="org">' + t('org') + '</div>' +
      '<h1 data-t="extraTitle">' + t('extraTitle') + '</h1>' +
      '<div class="sub" data-t="sub2">' + t('sub2') + '</div>' +
    '</div><div class="meta">' +
      '<div class="lbl" data-t="surveyNo">' + t('surveyNo') + '</div>' +
      '<div class="num">—————</div>' +
      '<div class="pg">' + t('extraPg') + extra + '</div>' +
    '</div></div>' +
    '<table><thead>' + headRow() + '</thead><tbody id="tbx' + extra + '"></tbody></table>' +
    '<div class="foot"><span data-t="footOrg">' + t('footOrg') + '</span>' +
    '<span>' + t('extraPg') + extra + '</span></div>';

  last.parentNode.insertBefore(s, last);
  buildRows('tbx' + extra, start, 32);
}
</script>
</body>
</html>
