<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أطواد — مصروف البنزين</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
:root{
  --deep:#0C3B5E; --steel:#1E5F8A; --sky:#0EA5E9; --ice:#E8F4FD; --frost:#F0F9FF;
  --slate:#334155; --mist:#94A3B8; --line:#E2E8F0;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#F1F5F9;color:var(--slate);padding-bottom:50px;}
.header{background:linear-gradient(135deg,var(--deep),var(--steel),var(--sky));color:#fff;padding:20px 18px;}
.header h1{font-size:19px;font-weight:900;}
.header p{font-size:12px;opacity:.85;margin-top:4px;}
.wrap{max-width:880px;margin:0 auto;padding:0 14px;}

/* لوحة الشهر */
.month-bar{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(12,59,94,.07);
  margin-top:-14px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.month-bar label{font-size:13px;font-weight:700;color:var(--deep);}
.month-bar input[type=month]{font-family:'Tajawal',sans-serif;font-size:14px;padding:8px 10px;
  border:1.5px solid var(--line);border-radius:9px;color:var(--slate);}
.spacer{flex:1;}
.ghost{background:#fff;border:1.5px solid var(--line);color:var(--slate);font-family:'Tajawal',sans-serif;
  font-weight:700;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;}
.ghost:hover{border-color:var(--sky);color:var(--deep);}

/* البطاقة الرئيسية: الإجمالي */
.total-card{background:linear-gradient(135deg,var(--deep),var(--steel));color:#fff;border-radius:16px;
  padding:22px;margin-top:14px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
.total-card .big{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px;}
.total-card .cur{font-size:16px;font-weight:700;opacity:.75;margin-inline-start:6px;}
.total-card .lbl{font-size:13px;opacity:.8;margin-bottom:8px;}
.total-card .delta{margin-inline-start:auto;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);
  padding:7px 12px;border-radius:9px;}

/* إحصاءات */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
.stat{background:#fff;border-radius:12px;padding:13px;text-align:center;box-shadow:0 1px 6px rgba(12,59,94,.06);}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--deep);}
.stat span{font-size:11px;color:var(--mist);}

/* الإدخال */
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(12,59,94,.06);padding:16px;margin-top:14px;}
.card h2{font-size:15px;font-weight:800;color:var(--deep);margin-bottom:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px;}
.field label{font-size:12px;font-weight:700;color:var(--mist);}
.field input{font-family:'Tajawal',sans-serif;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;color:var(--slate);background:var(--frost);}
.field input:focus{outline:2px solid var(--sky);outline-offset:1px;border-color:var(--sky);}
.add{background:var(--deep);color:#fff;border:none;font-family:'Tajawal',sans-serif;font-weight:800;
  font-size:15px;padding:11px 26px;border-radius:10px;cursor:pointer;}
.add:hover{background:var(--steel);}
.hint{font-size:12px;color:var(--mist);margin-top:9px;}
.quick{width:100%;margin-top:12px;background:var(--frost);border:1.5px dashed var(--sky);color:var(--deep);
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px;padding:13px;border-radius:11px;cursor:pointer;}
.quick:hover{background:var(--ice);}

/* شريط الأيام */
.days{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px;overflow-x:auto;padding-bottom:4px;}
.day{flex:1;min-width:9px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
.bar{background:var(--sky);border-radius:3px 3px 0 0;min-height:2px;transition:height .2s;}
.bar.zero{background:var(--line);}
.bar.top{background:var(--deep);}
.daynum{font-size:9px;color:var(--mist);text-align:center;margin-top:3px;}

/* الجدول */
table{width:100%;border-collapse:collapse;margin-top:4px;}
th{text-align:right;font-size:12px;color:var(--mist);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid #F1F5F9;font-size:14px;}
td.amt{font-weight:800;color:var(--deep);}
tr:last-child td{border-bottom:none;}
.del{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px;}
.del:hover{background:#FEE2E2;}
.empty{text-align:center;padding:34px 16px;color:var(--mist);font-size:14px;}
.warnbox{background:#FEF3C7;border:1.5px solid #FCD34D;color:#92400E;border-radius:11px;
  padding:11px 14px;font-size:13px;font-weight:700;margin-top:12px;}
@media(max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);}
  .total-card .big{font-size:38px;}
  .total-card .delta{margin-inline-start:0;}
}
@media print{
  body{background:#fff;} .month-bar,.card.entry,.del,.ghost{display:none;}
}
</style>
</head>
<body>

<div class="header">
  <h1>مصروف البنزين</h1>
  <p>مؤسسة أطواد — تسجيل يومي وحساب شهري</p>
</div>

<div class="wrap">

  <div class="month-bar">
    <label for="monthPick">الشهر</label>
    <input type="month" id="monthPick" onchange="render()">
    <span class="spacer"></span>
    <button class="ghost" onclick="exportCsv()">تنزيل ملف إكسل</button>
    <button class="ghost" onclick="window.print()">طباعة</button>
  </div>

  <div class="total-card">
    <div>
      <div class="lbl" id="monthLabel">إجمالي الشهر</div>
      <div><span class="big" id="monthTotal">0</span><span class="cur">ريال</span></div>
    </div>
    <div class="delta" id="deltaBox">لا توجد بيانات للشهر السابق</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sAvgDay">0</b><span>متوسط اليوم</span></div>
    <div class="stat"><b id="sCount">0</b><span>عدد التعبئات</span></div>
    <div class="stat"><b id="sAvgFill">0</b><span>متوسط التعبئة</span></div>
    <div class="stat"><b id="sForecast">0</b><span>توقع نهاية الشهر</span></div>
  </div>

  <div class="card entry">
    <h2>تسجيل تعبئة</h2>
    <div class="row">
      <div class="field">
        <label for="fDate">التاريخ</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label for="fAmount">المبلغ بالريال</label>
        <input type="number" id="fAmount" min="1" step="1" inputmode="decimal" value="100">
      </div>
      <div class="field">
        <label for="fNote">ملاحظة (اختياري)</label>
        <input type="text" id="fNote" maxlength="60" placeholder="المحطة أو الوجهة">
      </div>
      <button class="add" onclick="addEntry()">إضافة</button>
    </div>
    <button class="quick" onclick="quickFill()">تسجيل تعبئة 100 ريال اليوم</button>
    <p class="hint" id="entryHint">التعبئة المعتادة 100 ريال. غيّر المبلغ أعلاه إن اختلف.</p>
  </div>

  <div class="card">
    <h2>الصرف اليومي</h2>
    <div class="days" id="daysStrip"></div>
  </div>

  <div class="card">
    <h2>السجل</h2>
    <div id="tableBox"></div>
  </div>

  <div id="storageWarn"></div>

</div>

<script>
var STORE_KEY = 'atwad_fuel_v1';
var DEFAULT_FILL = 100;   // قيمة التعبئة المعتادة بالريال
var entries = [];
var storageOk = true;

/* ============ التخزين ============ */
function loadEntries(){
  try {
    var raw = window.localStorage.getItem(STORE_KEY);
    entries = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(entries)) entries = [];
  } catch(err) {
    storageOk = false;
    entries = [];
    document.getElementById('storageWarn').innerHTML =
      '<div class="warnbox">المتصفح يمنع الحفظ على هذا الجهاز. البيانات ستبقى حتى إغلاق الصفحة فقط — ' +
      'نزّل ملف إكسل قبل الإغلاق.</div>';
  }
}
function saveEntries(){
  if(!storageOk) return;
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(entries));
  } catch(err) {
    storageOk = false;
    document.getElementById('storageWarn').innerHTML =
      '<div class="warnbox">تعذر الحفظ: ' + escapeHtml(err.message) + '</div>';
  }
}

/* ============ أدوات ============ */
function escapeHtml(v){
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function todayIso(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function monthOf(iso){ return String(iso || '').slice(0,7); }
function daysInMonth(ym){
  var y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7));
  return new Date(y, m, 0).getDate();
}
function prevMonth(ym){
  var y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7)) - 1;
  if(m === 0){ m = 12; y--; }
  return y + '-' + pad2(m);
}
function money(n){
  var v = Math.round(Number(n) || 0);
  return v.toLocaleString('en-US');
}
var MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                   'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthTitle(ym){
  return MONTH_NAMES[Number(ym.slice(5,7)) - 1] + ' ' + ym.slice(0,4);
}
function sumOf(list){
  var t = 0;
  list.forEach(function(e){ t += Number(e.amount) || 0; });
  return t;
}
function entriesOfMonth(ym){
  return entries.filter(function(e){ return monthOf(e.date) === ym; });
}

/* ============ الإدخال ============ */
function addEntry(){
  var date = document.getElementById('fDate').value;
  var amountRaw = document.getElementById('fAmount').value;
  var note = document.getElementById('fNote').value.trim();
  var amount = Number(amountRaw);

  if(!date){ alert('اختر التاريخ.'); return; }
  if(!isFinite(amount) || amount <= 0){ alert('اكتب مبلغاً أكبر من صفر.'); return; }
  if(amount > 5000 && !confirm('المبلغ ' + money(amount) + ' ريال. هل هو صحيح؟')) return;

  entries.push({ id: String(Date.now()), date: date, amount: amount, note: note });
  saveEntries();

  document.getElementById('fAmount').value = DEFAULT_FILL;
  document.getElementById('fNote').value = '';
  document.getElementById('monthPick').value = monthOf(date);
  document.getElementById('fAmount').focus();
  render();
}

/** تسجيل تعبئة اليوم بالمبلغ المعتاد بضغطة واحدة */
function quickFill(){
  document.getElementById('fDate').value = todayIso();
  document.getElementById('fAmount').value = DEFAULT_FILL;
  addEntry();
}

function removeEntry(id){
  var row = entries.filter(function(e){ return e.id === id; })[0];
  if(!row) return;
  if(!confirm('حذف تعبئة ' + money(row.amount) + ' ريال بتاريخ ' + row.date + '؟')) return;
  entries = entries.filter(function(e){ return e.id !== id; });
  saveEntries();
  render();
}

/* ============ العرض ============ */
function render(){
  var ym = document.getElementById('monthPick').value || monthOf(todayIso());
  var list = entriesOfMonth(ym);
  var total = sumOf(list);
  var nDays = daysInMonth(ym);

  document.getElementById('monthLabel').textContent = 'إجمالي ' + monthTitle(ym);
  document.getElementById('monthTotal').textContent = money(total);

  // الأيام المنقضية: الشهر الجاري يُحسب حتى اليوم، والشهور السابقة كاملة
  var nowYm = monthOf(todayIso());
  var elapsed = nDays;
  if(ym === nowYm) elapsed = Number(todayIso().slice(8,10));
  if(ym > nowYm) elapsed = 0;

  var avgDay = elapsed > 0 ? total / elapsed : 0;
  document.getElementById('sAvgDay').textContent = money(avgDay);
  document.getElementById('sCount').textContent = list.length;
  document.getElementById('sAvgFill').textContent = list.length ? money(total / list.length) : 0;
  document.getElementById('sForecast').textContent = elapsed > 0 ? money(avgDay * nDays) : money(total);

  // المقارنة بالشهر السابق
  var prev = sumOf(entriesOfMonth(prevMonth(ym)));
  var box = document.getElementById('deltaBox');
  if(prev > 0){
    var diff = total - prev;
    var pct = Math.round(Math.abs(diff) / prev * 100);
    if(diff > 0)      box.textContent = 'أعلى من ' + monthTitle(prevMonth(ym)) + ' بـ ' + money(diff) + ' ريال (' + pct + '%)';
    else if(diff < 0) box.textContent = 'أقل من ' + monthTitle(prevMonth(ym)) + ' بـ ' + money(-diff) + ' ريال (' + pct + '%)';
    else              box.textContent = 'مطابق للشهر السابق';
  } else {
    box.textContent = 'لا توجد بيانات للشهر السابق';
  }

  renderStrip(ym, list, nDays);
  renderTable(list);
}

function renderStrip(ym, list, nDays){
  var byDay = {};
  list.forEach(function(e){
    var d = Number(e.date.slice(8,10));
    byDay[d] = (byDay[d] || 0) + (Number(e.amount) || 0);
  });
  var max = 0;
  Object.keys(byDay).forEach(function(k){ if(byDay[k] > max) max = byDay[k]; });

  var html = '';
  for(var d = 1; d <= nDays; d++){
    var v = byDay[d] || 0;
    var h = max > 0 ? Math.round(v / max * 100) : 0;
    var cls = v === 0 ? 'bar zero' : (v === max ? 'bar top' : 'bar');
    var title = v > 0 ? (d + ' — ' + money(v) + ' ريال') : (d + ' — لا تعبئة');
    html += '<div class="day" title="' + escapeHtml(title) + '">' +
              '<div class="' + cls + '" style="height:' + (v === 0 ? 2 : Math.max(h,4)) + '%;"></div>' +
              '<div class="daynum">' + (d % 5 === 0 || d === 1 ? d : '') + '</div>' +
            '</div>';
  }
  document.getElementById('daysStrip').innerHTML = html;
}

function renderTable(list){
  if(!list.length){
    document.getElementById('tableBox').innerHTML =
      '<div class="empty">لا توجد تعبئات في هذا الشهر. سجّل أول تعبئة من الأعلى.</div>';
    return;
  }
  var sorted = list.slice().sort(function(a,b){
    if(a.date === b.date) return Number(b.id) - Number(a.id);
    return a.date < b.date ? 1 : -1;
  });
  var html = '<table><thead><tr>' +
             '<th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th><th></th>' +
             '</tr></thead><tbody>';
  sorted.forEach(function(e){
    html += '<tr>' +
      '<td>' + escapeHtml(e.date) + '</td>' +
      '<td class="amt">' + money(e.amount) + ' ريال</td>' +
      '<td style="color:var(--mist);">' + escapeHtml(e.note || '—') + '</td>' +
      '<td style="text-align:left;"><button class="del" onclick="removeEntry(\'' + escapeHtml(e.id) + '\')">✕</button></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableBox').innerHTML = html;
}

/* ============ التصدير ============ */
function exportCsv(){
  if(!entries.length){ alert('لا توجد بيانات للتصدير.'); return; }
  var sorted = entries.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  var lines = ['التاريخ,المبلغ,ملاحظة'];
  sorted.forEach(function(e){
    var note = String(e.note || '').replace(/"/g,'""');
    lines.push(e.date + ',' + (Number(e.amount) || 0) + ',"' + note + '"');
  });
  var blob = new Blob(['\ufeff' + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'atwad-fuel-' + todayIso() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ============ البدء ============ */
loadEntries();
document.getElementById('fDate').value = todayIso();
document.getElementById('monthPick').value = monthOf(todayIso());
document.getElementById('fAmount').addEventListener('keydown', function(ev){
  if(ev.key === 'Enter') addEntry();
});
render();
</script>
</body>
</html>
