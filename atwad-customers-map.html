<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة أطواد — خريطة العملاء</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
:root{
  --deep:#0C3B5E; --steel:#1E5F8A; --sky:#0EA5E9; --ice:#E8F4FD; --frost:#F0F9FF;
  --slate:#334155; --mist:#94A3B8; --line:#E2E8F0;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444; --purple:#8B5CF6;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Tajawal',sans-serif;background:#F1F5F9;color:var(--slate);display:flex;flex-direction:column;}

.header{background:linear-gradient(135deg,var(--deep),var(--steel),var(--sky));color:#fff;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.header h1{font-size:17px;font-weight:900;}
.header p{font-size:11px;opacity:.85;margin-top:2px;}
.back{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);color:#fff;
  font-family:'Tajawal',sans-serif;font-weight:800;font-size:13px;padding:7px 14px;border-radius:9px;
  cursor:pointer;text-decoration:none;white-space:nowrap;}

.toolbar{background:#fff;padding:10px 14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line);}
.toolbar input[type=search]{font-family:'Tajawal',sans-serif;font-size:14px;padding:9px 12px;
  border:1.5px solid var(--line);border-radius:10px;min-width:190px;flex:1;max-width:300px;background:var(--frost);}
.toolbar select{font-family:'Tajawal',sans-serif;font-size:13px;padding:9px 10px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--slate);}
.chip{font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;padding:8px 13px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;color:var(--slate);cursor:pointer;}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep);}
.counts{font-size:12px;color:var(--mist);margin-inline-start:auto;font-weight:700;}
.counts b{color:var(--deep);}

.split{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0;}
.side{background:#fff;border-inline-end:1px solid var(--line);overflow-y:auto;}
#map{height:100%;width:100%;background:#E2E8F0;}

.cust{padding:11px 14px;border-bottom:1px solid #F1F5F9;cursor:pointer;}
.cust:hover{background:var(--frost);}
.cust.sel{background:var(--ice);border-inline-start:4px solid var(--sky);}
.cust .nm{font-weight:800;color:var(--deep);font-size:14px;}
.cust .meta{font-size:12px;color:var(--mist);margin-top:3px;}
.cust .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--ice);color:var(--steel);}
.tag.repeat{background:#D1FAE5;color:#065F46;}
.tag.new{background:#FEF3C7;color:#92400E;}
.empty{text-align:center;padding:40px 16px;color:var(--mist);font-size:14px;}

.pin-label{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:7px;
  padding:1px 6px;font-family:'Tajawal',sans-serif;font-size:11px;font-weight:800;color:var(--deep);
  box-shadow:0 1px 3px rgba(0,0,0,.12);white-space:nowrap;}
.leaflet-tooltip.pin-label:before{display:none;}
.pop{font-family:'Tajawal',sans-serif;direction:rtl;text-align:right;min-width:170px;}
.pop h4{font-size:14px;color:var(--deep);margin-bottom:5px;}
.pop p{font-size:12px;color:var(--slate);margin:2px 0;}
.pop a{display:inline-block;margin-top:7px;font-size:12px;font-weight:800;color:var(--sky);text-decoration:none;}

@media(max-width:820px){
  /* على الجوال: الصفحة تتمرّر طبيعياً، والخريطة بارتفاع ثابت صريح.
     الارتفاع النسبي داخل شبكة مرنة كان يُنتج خريطة بارتفاع صفر. */
  html,body{height:auto;}
  body{display:block;}
  .split{display:block;}
  #map{height:60vh;min-height:320px;}
  .side{border-inline-end:none;border-top:1px solid var(--line);max-height:none;overflow:visible;}
  .counts{width:100%;margin-inline-start:0;}
  .toolbar input[type=search]{max-width:none;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script src="atwad-admin-auth.js"></script>
</head>
<body>

<div class="header">
  <div>
    <h1>🗺️ خريطة العملاء</h1>
    <p>كل مواقع العملاء على خريطة واحدة</p>
  </div>
  <a class="back" href="atwad-appointments.html">← المواعيد</a>
</div>

<div class="toolbar">
  <input type="search" id="q" placeholder="ابحث باسم العميل أو رقمه أو الحي" oninput="applyFilters()">
  <select id="districtSel" onchange="applyFilters()"><option value="">كل الأحياء</option></select>
  <select id="periodSel" onchange="applyFilters()">
    <option value="all">كل الفترات</option>
    <option value="90">آخر 3 أشهر</option>
    <option value="180">آخر 6 أشهر</option>
    <option value="365">آخر سنة</option>
  </select>
  <button class="chip" id="dayChip" onclick="toggleDayMode()">مواعيد يوم</button>
  <input type="date" id="dayPick" style="display:none;font-family:'Tajawal',sans-serif;font-size:13px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;" onchange="applyFilters()">
  <button class="chip on" id="labelChip" onclick="toggleLabels()">الأسماء ظاهرة</button>
  <button class="chip" id="repeatChip" onclick="toggleRepeat()">المتكررون فقط</button>
  <span class="counts" id="counts">جارٍ التحميل…</span>
</div>

<div class="split">
  <div class="side" id="side"><div class="empty">جارٍ قراءة البيانات…</div></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var db = null;
try {
  if(!firebase.apps.length) firebase.initializeApp({databaseURL:'https://atwad-booking-default-rtdb.firebaseio.com'});
  db = firebase.database();
} catch(err) {
  console.error('Firebase init:', err);
}

var JEDDAH = [21.6, 39.16];
var map, markerLayer;
var allRecords = [];     // كل المواعيد والحجوزات كما هي
var dayMode = false;     // عرض مواعيد يوم واحد بدل كل العملاء
var customers = [];      // العملاء بعد التجميع
var shown = [];          // المعروضون بعد التصفية
var markers = {};        // phone -> marker
var showLabels = true;
var repeatOnly = false;
var noLocationCount = 0;

/* ============ أدوات ============ */
function esc(v){
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function normPhone(p){
  var s = String(p || '').replace(/[^0-9]/g,'');
  if(s.indexOf('966') === 0) s = '0' + s.slice(3);
  return s;
}
function validCoords(lat, lng){
  return isFinite(lat) && isFinite(lng) &&
         lat > 15 && lat < 33 && lng > 33 && lng < 56;   // نطاق السعودية تقريباً
}
/** يستخرج الإحداثيات من الحقول أو من رابط الخرائط */
function coordsOf(rec){
  var lat = Number(rec.lat), lng = Number(rec.lng);
  if(validCoords(lat, lng)) return [lat, lng];

  var link = String(rec.mapsLink || rec.locationUrl || rec.mapLink || '');
  if(!link) return null;
  var patterns = [
    /destination=(-?\d+\.\d+)(?:,|%2[Cc])(-?\d+\.\d+)/,
    /[?&](?:daddr|ll|sll)=(-?\d+\.\d+)(?:,|%2[Cc])(-?\d+\.\d+)/,
    /[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/,
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /(-?\d{1,2}\.\d{4,}),\s*(-?\d{2}\.\d{4,})/
  ];
  for(var i = 0; i < patterns.length; i++){
    var m = link.match(patterns[i]);
    if(m){
      var a = Number(m[1]), b = Number(m[2]);
      if(validCoords(a, b)) return [a, b];
    }
  }
  return null;   // الروابط المختصرة maps.app.goo.gl لا تحمل إحداثيات
}
function daysSince(iso){
  var t = Date.parse(String(iso || '') + 'T00:00:00');
  if(!isFinite(t)) return null;
  return Math.round((Date.now() - t) / 86400000);
}

/* ============ القراءة والتجميع ============ */
function loadAll(){
  if(!db){
    document.getElementById('side').innerHTML = '<div class="empty">⚠️ تعذّر الاتصال بقاعدة البيانات</div>';
    return;
  }
  var records = [];
  db.ref('appointments').once('value').then(function(snap){
    snap.forEach(function(c){ records.push(c.val() || {}); });
    return db.ref('bookings').once('value');
  }).then(function(snap2){
    snap2.forEach(function(c){ records.push(c.val() || {}); });
    allRecords = records;
    buildCustomers(records);
  }).catch(function(err){
    console.error('read error:', err);
    document.getElementById('side').innerHTML =
      '<div class="empty">⚠️ تعذّر تحميل البيانات: ' + esc(err.message) + '</div>';
  });
}

function buildCustomers(records){
  var byPhone = {};
  noLocationCount = 0;

  records.forEach(function(r){
    var phone = normPhone(r.phone);
    if(!phone) return;
    var pos = coordsOf(r);
    var name = String(r.client || r.name || '').trim() || 'بلا اسم';
    var date = String(r.date || '');

    if(!byPhone[phone]){
      byPhone[phone] = { phone:phone, name:name, visits:0, lastDate:'', pos:null,
                         district:'', address:'', services:{} };
    }
    var c = byPhone[phone];
    c.visits++;
    if(date > c.lastDate){
      c.lastDate = date;
      if(name !== 'بلا اسم') c.name = name;
      if(r.district) c.district = String(r.district);
      if(r.address)  c.address  = String(r.address);
    }
    if(r.service) c.services[r.service] = (c.services[r.service] || 0) + 1;
    if(pos && !c.pos) c.pos = pos;      // أول موقع دقيق يُعتمد
    if(pos) c.pos = c.pos || pos;
  });

  customers = [];
  Object.keys(byPhone).forEach(function(k){
    var c = byPhone[k];
    if(c.pos) customers.push(c);
    else noLocationCount++;
  });

  customers.sort(function(a,b){ return b.visits - a.visits; });
  fillDistricts();
  initMap();
  applyFilters();
}

function fillDistricts(){
  var set = {};
  customers.forEach(function(c){ if(c.district) set[c.district] = true; });
  var names = Object.keys(set).sort();
  var sel = document.getElementById('districtSel');
  names.forEach(function(n){
    var opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  });
}

/* ============ الخريطة ============ */
function initMap(){
  if(map) return;
  map = L.map('map', { zoomControl:true }).setView(JEDDAH, 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);

  // Leaflet يقيس الحاوية لحظة الإنشاء؛ على الجوال قد لا تكون أبعادها
  // النهائية قد استقرت بعد، فتظهر الخريطة فارغة أو مقصوصة.
  var fix = function(){ if(map) map.invalidateSize(); };
  setTimeout(fix, 150);
  setTimeout(fix, 600);
  window.addEventListener('resize', fix);
  window.addEventListener('orientationchange', function(){ setTimeout(fix, 300); });
}

function markerColor(c){
  if(c.visits >= 3) return '#10B981';        // عميل وفيّ
  if(c.visits === 2) return '#0EA5E9';
  return '#8B5CF6';                          // زيارة واحدة
}

function drawMarkers(){
  markerLayer.clearLayers();
  markers = {};
  var bounds = [];

  shown.forEach(function(c){
    var color = markerColor(c);
    var m = L.circleMarker(c.pos, {
      radius: c.visits >= 3 ? 9 : 7,
      color: '#fff', weight: 2, fillColor: color, fillOpacity: .95
    });

    var top = Object.keys(c.services).sort(function(a,b){
      return c.services[b] - c.services[a];
    })[0] || '—';
    var since = daysSince(c.lastDate);
    var html = '<div class="pop">' +
      '<h4>' + esc(c.name) + '</h4>' +
      '<p>📱 ' + esc(c.phone) + '</p>' +
      '<p>🔁 ' + c.visits + ' زيارة</p>' +
      '<p>🛠️ ' + esc(top) + '</p>' +
      (c.district ? '<p>📍 ' + esc(c.district) + '</p>' : '') +
      (c.lastDate ? '<p>📅 آخر زيارة: ' + esc(c.lastDate) +
        (since !== null ? ' (قبل ' + since + ' يوم)' : '') + '</p>' : '') +
      '<a href="https://www.google.com/maps/dir/?api=1&destination=' +
        c.pos[0] + ',' + c.pos[1] + '" target="_blank" rel="noopener">فتح الاتجاهات ←</a>' +
      '</div>';
    m.bindPopup(html);

    if(showLabels){
      m.bindTooltip(esc(c.name), {
        permanent:true, direction:'top', offset:[0,-6], className:'pin-label'
      });
    }
    m.on('click', function(){ highlight(c.phone, false); });

    m.addTo(markerLayer);
    markers[c.phone] = m;
    bounds.push(c.pos);
  });

  if(bounds.length) map.fitBounds(bounds, { padding:[40,40], maxZoom:14 });
}

/* ============ القائمة والتصفية ============ */
function todayIso(){
  var d = new Date();
  var p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function toggleDayMode(){
  dayMode = !dayMode;
  var chip = document.getElementById('dayChip');
  var pick = document.getElementById('dayPick');
  chip.className = dayMode ? 'chip on' : 'chip';
  pick.style.display = dayMode ? 'inline-block' : 'none';
  ['districtSel','periodSel','repeatChip'].forEach(function(id){
    var el = document.getElementById(id);
    if(el){ el.disabled = dayMode; el.style.opacity = dayMode ? '.45' : '1'; }
  });
  if(dayMode && !pick.value) pick.value = todayIso();
  applyFilters();
}

/** مواعيد اليوم المحدد، مرتبة بالوقت، ولها إحداثيات */
function dayAppointments(){
  var day = document.getElementById('dayPick').value || todayIso();
  var q = document.getElementById('q').value.trim();
  var out = [];
  allRecords.forEach(function(r){
    if(String(r.date || '') !== day) return;
    var pos = coordsOf(r);
    if(!pos) return;
    var name = String(r.client || r.name || '').trim() || 'بلا اسم';
    if(q && (name + ' ' + normPhone(r.phone) + ' ' + (r.district||'') + ' ' + (r.address||'')).indexOf(q) === -1) return;
    out.push({
      name:name, phone:normPhone(r.phone), pos:pos,
      time:String(r.time || ''), service:String(r.service || ''),
      tech:String(r.tech || r.technician || ''), status:String(r.status || ''),
      units:r.units, district:String(r.district || ''), address:String(r.address || '')
    });
  });
  out.sort(function(a,b){ return a.time < b.time ? -1 : (a.time > b.time ? 1 : 0); });
  return out;
}

function statusLabel(st){
  var m = { done:'مكتمل', pending:'في الانتظار', confirmed:'مؤكد', cancelled:'ملغى' };
  return m[st] || st || '—';
}

function drawDayMarkers(list){
  markerLayer.clearLayers();
  markers = {};
  var bounds = [];
  var line = [];

  list.forEach(function(a, i){
    var num = i + 1;
    var icon = L.divIcon({
      className:'',
      html:'<div style="background:' + (a.status === 'done' ? '#10B981' : '#0C3B5E') +
           ';color:#fff;width:26px;height:26px;border-radius:50%;border:2px solid #fff;' +
           'box-shadow:0 1px 4px rgba(0,0,0,.35);font-family:Tajawal,sans-serif;font-weight:900;' +
           'font-size:13px;display:flex;align-items:center;justify-content:center;">' + num + '</div>',
      iconSize:[26,26], iconAnchor:[13,13]
    });
    var m = L.marker(a.pos, { icon: icon });
    var html = '<div class="pop">' +
      '<h4>' + num + '. ' + esc(a.name) + '</h4>' +
      (a.time ? '<p>🕐 ' + esc(a.time) + '</p>' : '') +
      '<p>🛠️ ' + esc(a.service) + (a.units ? ' (' + esc(a.units) + ' وحدة)' : '') + '</p>' +
      (a.tech ? '<p>👷 ' + esc(a.tech) + '</p>' : '') +
      '<p>📱 ' + esc(a.phone) + '</p>' +
      '<p>📋 ' + esc(statusLabel(a.status)) + '</p>' +
      '<a href="https://www.google.com/maps/dir/?api=1&destination=' +
        a.pos[0] + ',' + a.pos[1] + '" target="_blank" rel="noopener">فتح الاتجاهات ←</a>' +
      '</div>';
    m.bindPopup(html);
    if(showLabels){
      m.bindTooltip(esc(a.name) + (a.time ? ' · ' + esc(a.time.split(' ')[0]) : ''),
        { permanent:true, direction:'top', offset:[0,-14], className:'pin-label' });
    }
    m.on('click', function(){ highlight(a.phone, false); });
    m.addTo(markerLayer);
    markers[a.phone] = m;
    bounds.push(a.pos);
    line.push(a.pos);
  });

  if(line.length > 1){
    L.polyline(line, { color:'#0EA5E9', weight:3, opacity:.55, dashArray:'6,7' }).addTo(markerLayer);
  }
  if(bounds.length) map.fitBounds(bounds, { padding:[50,50], maxZoom:15 });
}

function renderDaySide(list){
  var el = document.getElementById('side');
  if(!list.length){
    el.innerHTML = '<div class="empty">لا مواعيد بموقع دقيق في هذا اليوم.</div>';
    return;
  }
  var html = '';
  list.forEach(function(a, i){
    html += '<div class="cust" id="row_' + esc(a.phone) + '" onclick="highlight(\'' + esc(a.phone) + '\',true)">' +
      '<div class="nm">' + (i+1) + '. ' + esc(a.name) + '</div>' +
      '<div class="meta">' + esc(a.time || '—') + ' · ' + esc(a.service) + '</div>' +
      '<div class="tags">' +
        (a.tech ? '<span class="tag">' + esc(a.tech) + '</span>' : '') +
        '<span class="tag ' + (a.status === 'done' ? 'repeat' : '') + '">' + esc(statusLabel(a.status)) + '</span>' +
        (a.district ? '<span class="tag">' + esc(a.district) + '</span>' : '') +
      '</div></div>';
  });
  el.innerHTML = html;
}

function applyFilters(){
  if(!map) return;

  if(dayMode){
    var dayList = dayAppointments();
    var dayStr = document.getElementById('dayPick').value || todayIso();
    var totalDay = 0, missing = [];
    allRecords.forEach(function(r){
      if(String(r.date || '') !== dayStr) return;
      totalDay++;
      if(!coordsOf(r)) missing.push(String(r.client || r.name || 'بلا اسم'));
    });
    document.getElementById('counts').innerHTML =
      '<b>' + dayList.length + '</b> من ' + totalDay + ' موعد يوم ' + esc(dayStr) +
      (missing.length ? ' · بلا موقع: ' + esc(missing.join('، ')) : ' · الكل محدد');
    drawDayMarkers(dayList);
    renderDaySide(dayList);
    return;
  }

  var q = document.getElementById('q').value.trim();
  var dis = document.getElementById('districtSel').value;
  var period = document.getElementById('periodSel').value;

  shown = customers.filter(function(c){
    if(repeatOnly && c.visits < 2) return false;
    if(dis && c.district !== dis) return false;
    if(period !== 'all'){
      var d = daysSince(c.lastDate);
      if(d === null || d > Number(period)) return false;
    }
    if(q){
      var hay = c.name + ' ' + c.phone + ' ' + c.district + ' ' + c.address;
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  document.getElementById('counts').innerHTML =
    '<b>' + shown.length + '</b> عميل على الخريطة' +
    (noLocationCount ? ' · ' + noLocationCount + ' بلا موقع دقيق' : '');

  drawMarkers();
  renderSide();
}

function renderSide(){
  var el = document.getElementById('side');
  if(!shown.length){
    el.innerHTML = '<div class="empty">لا يوجد عملاء مطابقون.</div>';
    return;
  }
  var html = '';
  shown.forEach(function(c){
    var since = daysSince(c.lastDate);
    html += '<div class="cust" id="row_' + esc(c.phone) + '" onclick="highlight(\'' + esc(c.phone) + '\',true)">' +
      '<div class="nm">' + esc(c.name) + '</div>' +
      '<div class="meta">' + esc(c.phone) + (c.district ? ' · ' + esc(c.district) : '') + '</div>' +
      '<div class="tags">' +
        '<span class="tag ' + (c.visits >= 3 ? 'repeat' : (c.visits === 1 ? 'new' : '')) + '">' +
          c.visits + ' زيارة</span>' +
        (since !== null ? '<span class="tag">قبل ' + since + ' يوم</span>' : '') +
      '</div></div>';
  });
  el.innerHTML = html;
}

function highlight(phone, fromList){
  var rows = document.querySelectorAll('.cust');
  for(var i = 0; i < rows.length; i++) rows[i].classList.remove('sel');
  var row = document.getElementById('row_' + phone);
  if(row){
    row.classList.add('sel');
    if(!fromList) row.scrollIntoView({block:'nearest'});
  }
  var m = markers[phone];
  if(m && fromList){
    map.setView(m.getLatLng(), 15, { animate:true });
    m.openPopup();
  }
}

function toggleLabels(){
  showLabels = !showLabels;
  var b = document.getElementById('labelChip');
  b.textContent = showLabels ? 'الأسماء ظاهرة' : 'الأسماء مخفية';
  b.className = showLabels ? 'chip on' : 'chip';
  applyFilters();   // يحترم الوضع الحالي: يوم محدد أو كل العملاء
}
function toggleRepeat(){
  if(dayMode) return;   // لا معنى لـ«المتكررون» داخل يوم واحد
  repeatOnly = !repeatOnly;
  var b = document.getElementById('repeatChip');
  b.className = repeatOnly ? 'chip on' : 'chip';
  applyFilters();
}

/* atwad-admin-auth.js يطلق هذا الحدث بعد نجاح تسجيل الدخول */
var loadStarted = false;
function startOnce(){
  if(loadStarted) return;
  loadStarted = true;
  loadAll();
}
window.addEventListener('atwad-admin-auth-ready', startOnce);
window.__atwadInitPage = startOnce;   // توافق مع atwad-auth.js في صفحات أخرى

/* شبكة أمان: إن لم يصل الحدث خلال ثلاث ثوانٍ (نسخة مختلفة من ملف المصادقة)
   نبدأ القراءة مباشرة — قواعد Firebase هي التي تحمي البيانات في كل الأحوال. */
setTimeout(startOnce, 3000);
</script>
