<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة أطواد - الملخص المالي</title>
<link rel="manifest" href="/atwad/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/atwad/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/atwad/apple-touch-icon.png">
<meta name="theme-color" content="#0B2545">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#0C3B5E;--sky:#0EA5E9;--ice:#E8F4FD;--frost:#F0F9FF;--success:#10B981;--warning:#F59E0B;--danger:#EF4444;--slate:#334155;--mist:#94A3B8;--navy:#0B2545;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:#F1F5F9;color:var(--slate);min-height:100vh;}
.topbar{background:linear-gradient(135deg,var(--navy),var(--deep));color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar h1{font-size:20px;font-weight:900;}
.topbar .sub{font-size:12px;opacity:.75;margin-top:2px;}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;}
.tb{padding:9px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
.tb.primary{background:#fff;color:var(--deep);border-color:#fff;}
.tb:disabled{opacity:.5;cursor:not-allowed;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.period-bar{background:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:16px;}
.pchip{padding:7px 14px;border-radius:20px;border:1.5px solid #E2E8F0;background:#fff;font-family:'Tajawal',sans-serif;font-size:12px;font-weight:700;color:var(--mist);cursor:pointer;}
.pchip.active{border-color:var(--sky);color:var(--sky);background:var(--ice);}
.custom{display:none;gap:6px;align-items:center;font-size:12px;}
.custom.show{display:flex;}
.custom input{padding:6px 8px;border:1.5px solid #E2E8F0;border-radius:8px;font-family:'Tajawal',sans-serif;font-size:12px;}
.rep-head{display:none;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04);border-right:4px solid var(--sky);}
.kpi.good{border-color:var(--success);} .kpi.bad{border-color:var(--danger);} .kpi.warn{border-color:var(--warning);} .kpi.navy{border-color:var(--navy);}
.kpi .v{font-size:24px;font-weight:900;color:var(--deep);line-height:1.1;}
.kpi .l{font-size:12px;color:var(--mist);margin-top:4px;font-weight:600;}
.kpi .c{font-size:11px;margin-top:6px;font-weight:700;}
.up{color:#047857;} .down{color:#B91C1C;} .flat{color:var(--mist);}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:16px;}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
.card h3{font-size:15px;font-weight:800;color:var(--deep);margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px solid #F1F5F9;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--frost);color:var(--slate);font-weight:700;padding:8px 8px;text-align:right;border-bottom:1.5px solid #E2E8F0;}
td{padding:8px 8px;border-bottom:1px solid #F1F5F9;}
td.n,th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr;}
tr.total td{font-weight:800;color:var(--deep);background:#F8FAFC;}
.pos{color:#047857;font-weight:700;} .neg{color:#B91C1C;font-weight:700;}
.empty{padding:14px;color:var(--mist);font-size:12px;text-align:center;}
.note{font-size:11px;color:var(--mist);line-height:1.7;margin-top:10px;}
.loading{text-align:center;padding:50px;color:var(--mist);}
.bar{height:8px;background:#EEF2F7;border-radius:4px;overflow:hidden;margin-top:4px;}
.bar i{display:block;height:100%;background:var(--sky);}
@media(max-width:600px){.kpi .v{font-size:20px;} .topbar h1{font-size:17px;}}
@media print{
  @page{size:A4;margin:14mm 12mm;}
  body{background:#fff;color:#000;}
  .topbar,.period-bar,.no-print,#authSignOutBtn{display:none !important;}
  .wrap{max-width:none;padding:0;}
  .rep-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:12px;}
  .rep-head .brand{font-size:18px;font-weight:900;color:var(--navy);}
  .rep-head .meta{font-size:11px;color:#475569;text-align:left;line-height:1.6;}
  .kpi,.card{box-shadow:none;border:1px solid #CBD5E1;break-inside:avoid;}
  .kpis{grid-template-columns:repeat(4,1fr);gap:8px;}
  .kpi .v{font-size:18px;} .kpi .l{font-size:10px;}
  .grid2{grid-template-columns:1fr 1fr;gap:10px;}
  table{font-size:11px;} th,td{padding:5px 6px;}
  .card h3{font-size:13px;}
  .bar{display:none;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
<script src="atwad-admin-auth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="topbar">
  <div>
    <h1>📄 الملخص المالي</h1>
    <div class="sub" id="subTitle">مؤسسة أطواد لصيانة المكيفات</div>
  </div>
  <div class="top-actions">
    <button class="tb" onclick="window.open('atwad-finance.html','_blank')">💰 الإدارة المالية</button>
    <button class="tb" id="btnXlsx" onclick="exportExcel()" disabled>📊 تصدير Excel</button>
    <button class="tb primary" id="btnPdf" onclick="window.print()" disabled>🖨️ طباعة / PDF</button>
  </div>
</div>

<div class="wrap">
  <div class="period-bar">
    <span style="font-size:12px;font-weight:700;color:var(--mist);">الفترة:</span>
    <button class="pchip active" data-p="month" onclick="setPeriod('month',this)">هذا الشهر</button>
    <button class="pchip" data-p="lastmonth" onclick="setPeriod('lastmonth',this)">الشهر الماضي</button>
    <button class="pchip" data-p="quarter" onclick="setPeriod('quarter',this)">هذا الربع</button>
    <button class="pchip" data-p="year" onclick="setPeriod('year',this)">هذه السنة</button>
    <button class="pchip" data-p="all" onclick="setPeriod('all',this)">الكل</button>
    <button class="pchip" data-p="custom" onclick="setPeriod('custom',this)">مخصص</button>
    <div class="custom" id="customBox">
      <input type="date" id="cFrom"> <span>إلى</span> <input type="date" id="cTo">
      <button class="pchip active" onclick="applyCustom()">تطبيق</button>
    </div>
  </div>

  <div class="rep-head">
    <div class="brand">مؤسسة أطواد لصيانة المكيفات — الملخص المالي</div>
    <div class="meta" id="repMeta"></div>
  </div>

  <div id="body"><div class="loading">⏳ جاري تحميل البيانات المالية...</div></div>
</div>

<script>
// ============================================================
// الملخص المالي — قراءة فقط من transactions و appointments
// لا يكتب أي شيء في Firebase
// ============================================================
var db = null;
var TX = [];      // كل القيود المالية
var APPTS = [];   // كل المواعيد (للزيارات المكتملة والضمان)
var period = 'month';
var range = { from: '', to: '' };     // الفترة الحالية
var prevRange = { from: '', to: '' }; // الفترة المقابلة السابقة
var lastReport = null;

function todayStr(){
  try {
    var parts = new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    var o = {}; parts.forEach(function(p){ if(p.type !== 'literal') o[p.type] = p.value; });
    return o.year + '-' + o.month + '-' + o.day;
  } catch(e){ return new Date().toISOString().split('T')[0]; }
}
function pad(n){ return String(n).padStart(2,'0'); }
function iso(y,m,d){ return y + '-' + pad(m) + '-' + pad(d); }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function fmt(n){ return (Math.round(n) || 0).toLocaleString('en-US'); }
function fmtR(n){ return fmt(n) + ' ﷼'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// نفس منطق صفحة الإدارة المالية
function normStatus(s){ return s === 'معلق' ? 'غير مدفوع' : (s || 'مدفوع'); }
function collected(e){
  var s = normStatus(e.status);
  if(s === 'مدفوع') return parseFloat(e.amount) || 0;
  if(s === 'مدفوع جزئياً'){
    if(Array.isArray(e.payments) && e.payments.length){
      return e.payments.reduce(function(sum,p){ return sum + (parseFloat(p.amount) || 0); }, 0);
    }
    return parseFloat(e.paidAmount) || 0;
  }
  return 0;
}
function isLive(e){ return e.status !== 'ملغي' && e.status !== 'مسوى'; }
function isReceivable(e){
  if(e.type !== 'income' || !isLive(e)) return false;
  var s = normStatus(e.status);
  return s === 'غير مدفوع' || s === 'مؤجل' || s === 'مدفوع جزئياً';
}
function isWarrantyTx(e){
  return e.warrantyRework === true || e.category === 'ضمان' || e.category === 'تكلفة ضمان';
}

// ===== الفترات =====
function computeRange(p){
  var t = todayStr().split('-');
  var y = parseInt(t[0],10), m = parseInt(t[1],10);
  var r = { from:'', to:'' }, pr = { from:'', to:'' };
  if(p === 'month'){
    r.from = iso(y,m,1); r.to = iso(y,m,daysInMonth(y,m));
    var pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
    pr.from = iso(py,pm,1); pr.to = iso(py,pm,daysInMonth(py,pm));
  } else if(p === 'lastmonth'){
    var lm = m === 1 ? 12 : m - 1, ly = m === 1 ? y - 1 : y;
    r.from = iso(ly,lm,1); r.to = iso(ly,lm,daysInMonth(ly,lm));
    var ppm = lm === 1 ? 12 : lm - 1, ppy = lm === 1 ? ly - 1 : ly;
    pr.from = iso(ppy,ppm,1); pr.to = iso(ppy,ppm,daysInMonth(ppy,ppm));
  } else if(p === 'quarter'){
    var qs = Math.floor((m - 1) / 3) * 3 + 1;
    r.from = iso(y,qs,1); r.to = iso(y,qs+2,daysInMonth(y,qs+2));
    var pqs = qs - 3, pqy = y;
    if(pqs < 1){ pqs = 10; pqy = y - 1; }
    pr.from = iso(pqy,pqs,1); pr.to = iso(pqy,pqs+2,daysInMonth(pqy,pqs+2));
  } else if(p === 'year'){
    r.from = iso(y,1,1); r.to = iso(y,12,31);
    pr.from = iso(y-1,1,1); pr.to = iso(y-1,12,31);
  } else if(p === 'custom'){
    r.from = document.getElementById('cFrom').value || '';
    r.to = document.getElementById('cTo').value || '';
    if(r.from && r.to){
      var a = new Date(r.from + 'T00:00:00'), b = new Date(r.to + 'T00:00:00');
      var days = Math.round((b - a) / 86400000) + 1;
      var pb = new Date(a.getTime() - 86400000), pa = new Date(pb.getTime() - (days - 1) * 86400000);
      pr.from = pa.toISOString().split('T')[0]; pr.to = pb.toISOString().split('T')[0];
    }
  }
  range = r; prevRange = pr;
}
function inRange(d, r){
  if(!r.from && !r.to) return true;
  if(!d) return false;
  if(r.from && d < r.from) return false;
  if(r.to && d > r.to) return false;
  return true;
}
function rangeLabel(r){
  if(!r.from && !r.to) return 'كل الفترات';
  return 'من ' + r.from + ' إلى ' + r.to;
}

function setPeriod(p, el){
  period = p;
  var chips = document.querySelectorAll('.period-bar .pchip[data-p]');
  for(var i = 0; i < chips.length; i++){ chips[i].classList.remove('active'); }
  if(el) el.classList.add('active');
  var cb = document.getElementById('customBox');
  if(p === 'custom'){
    cb.classList.add('show');
    if(!document.getElementById('cFrom').value){
      var t = todayStr().split('-');
      document.getElementById('cFrom').value = iso(parseInt(t[0],10), parseInt(t[1],10), 1);
      document.getElementById('cTo').value = todayStr();
    }
    return;
  }
  cb.classList.remove('show');
  computeRange(p);
  render();
}
function applyCustom(){
  computeRange('custom');
  if(!range.from || !range.to){ alert('حدّد تاريخ البداية والنهاية'); return; }
  if(range.from > range.to){ alert('تاريخ البداية بعد تاريخ النهاية'); return; }
  render();
}

// ===== الحساب =====
function summarize(r){
  var tx = TX.filter(function(e){ return isLive(e) && inRange(e.date || '', r); });
  var income = tx.filter(function(e){ return e.type === 'income'; });
  var expense = tx.filter(function(e){ return e.type === 'expense'; });

  var s = {
    collected: 0, billed: 0, cash: 0, transfer: 0, expenses: 0,
    incomeByCat: {}, expenseByCat: {}, incomeCount: income.length, expenseCount: expense.length,
    warrantyCost: 0, warrantyCount: 0, receivables: [], receivableTotal: 0,
    visits: 0, warrantyVisits: 0, byMonth: {}
  };
  income.forEach(function(e){
    var c = collected(e), amt = parseFloat(e.amount) || 0;
    s.collected += c; s.billed += amt;
    if(c > 0){
      if(String(e.method || '').indexOf('تحويل') >= 0) s.transfer += c; else s.cash += c;
    }
    var cat = e.category || 'أخرى';
    s.incomeByCat[cat] = (s.incomeByCat[cat] || 0) + c;
    if(isWarrantyTx(e)) s.warrantyCount += 1;
    var mk = String(e.date || '').slice(0,7);
    if(mk){ if(!s.byMonth[mk]) s.byMonth[mk] = { inc:0, exp:0 }; s.byMonth[mk].inc += c; }
  });
  expense.forEach(function(e){
    var amt = parseFloat(e.amount) || 0;
    s.expenses += amt;
    var cat = e.category || 'أخرى';
    s.expenseByCat[cat] = (s.expenseByCat[cat] || 0) + amt;
    if(isWarrantyTx(e)) s.warrantyCost += amt;
    var mk = String(e.date || '').slice(0,7);
    if(mk){ if(!s.byMonth[mk]) s.byMonth[mk] = { inc:0, exp:0 }; s.byMonth[mk].exp += amt; }
  });
  s.net = s.collected - s.expenses;

  // الذمم: كل ما لم يُحصَّل بعد (بغض النظر عن الفترة إن كانت "الكل"، وإلا بتاريخ القيد)
  TX.forEach(function(e){
    if(!isReceivable(e)) return;
    if(!inRange(e.date || '', r)) return;
    var rem = (parseFloat(e.amount) || 0) - collected(e);
    if(rem <= 0) return;
    s.receivables.push({ party: e.party || e.desc || '—', date: e.date || '', remaining: rem, status: normStatus(e.status) });
    s.receivableTotal += rem;
  });
  s.receivables.sort(function(a,b){ return b.remaining - a.remaining; });

  APPTS.forEach(function(a){
    if(a.status !== 'done') return;
    if(!inRange(a.date || '', r)) return;
    if(a.warrantyRework) s.warrantyVisits += 1; else s.visits += 1;
  });
  s.avgVisit = s.visits ? s.collected / s.visits : 0;
  return s;
}

function changeHtml(cur, prev, invert){
  if(!prevRange.from) return '';
  if(!prev){ return cur ? '<span class="flat">لا مقارنة سابقة</span>' : ''; }
  var pct = Math.round((cur - prev) / Math.abs(prev) * 100);
  var good = invert ? pct <= 0 : pct >= 0;
  var cls = pct === 0 ? 'flat' : (good ? 'up' : 'down');
  var arrow = pct > 0 ? '▲' : (pct < 0 ? '▼' : '=');
  return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(pct) + '% عن الفترة السابقة</span>';
}
function catTable(obj, total, cls){
  var keys = Object.keys(obj).sort(function(a,b){ return obj[b] - obj[a]; });
  if(!keys.length) return '<div class="empty">لا توجد بيانات في هذه الفترة</div>';
  var h = '<table><thead><tr><th>التصنيف</th><th class="n">المبلغ</th><th class="n">النسبة</th></tr></thead><tbody>';
  keys.forEach(function(k){
    var pct = total ? Math.round(obj[k] / total * 100) : 0;
    h += '<tr><td>' + esc(k) + '<div class="bar"><i style="width:' + pct + '%;' + (cls === 'neg' ? 'background:var(--danger)' : '') + '"></i></div></td><td class="n">' + fmt(obj[k]) + '</td><td class="n">' + pct + '%</td></tr>';
  });
  h += '<tr class="total"><td>الإجمالي</td><td class="n">' + fmt(total) + '</td><td class="n">100%</td></tr></tbody></table>';
  return h;
}

function render(){
  var s = summarize(range);
  var p = prevRange.from ? summarize(prevRange) : null;
  lastReport = { s: s, p: p };

  document.getElementById('subTitle').textContent = rangeLabel(range);
  document.getElementById('repMeta').innerHTML = esc(rangeLabel(range)) + '<br>أُصدر في ' + todayStr();

  var netCls = s.net >= 0 ? 'good' : 'bad';
  var h = '';
  h += '<div class="kpis">';
  h += '<div class="kpi good"><div class="v">' + fmtR(s.collected) + '</div><div class="l">الإيرادات المحصَّلة</div><div class="c">' + (p ? changeHtml(s.collected, p.collected, false) : '') + '</div></div>';
  h += '<div class="kpi bad"><div class="v">' + fmtR(s.expenses) + '</div><div class="l">المصروفات</div><div class="c">' + (p ? changeHtml(s.expenses, p.expenses, true) : '') + '</div></div>';
  h += '<div class="kpi ' + netCls + '"><div class="v ' + (s.net < 0 ? 'neg' : '') + '">' + fmtR(s.net) + '</div><div class="l">صافي الربح</div><div class="c">' + (p ? changeHtml(s.net, p.net, false) : '') + '</div></div>';
  h += '<div class="kpi warn"><div class="v">' + fmtR(s.receivableTotal) + '</div><div class="l">ذمم غير محصَّلة</div><div class="c flat">' + s.receivables.length + ' عميل</div></div>';
  h += '<div class="kpi navy"><div class="v">' + s.visits + '</div><div class="l">زيارات مكتملة</div><div class="c flat">' + (p ? changeHtml(s.visits, p.visits, false) : '') + '</div></div>';
  h += '<div class="kpi"><div class="v">' + fmtR(s.avgVisit) + '</div><div class="l">متوسط إيراد الزيارة</div><div class="c">' + (p ? changeHtml(s.avgVisit, p.avgVisit, false) : '') + '</div></div>';
  h += '<div class="kpi"><div class="v">' + fmtR(s.cash) + ' / ' + fmtR(s.transfer) + '</div><div class="l">نقداً / تحويل</div><div class="c flat">' + (s.collected ? Math.round(s.cash / s.collected * 100) : 0) + '% نقدي</div></div>';
  h += '<div class="kpi bad"><div class="v">' + fmtR(s.warrantyCost) + '</div><div class="l">تكلفة الضمان (إعادة عمل)</div><div class="c flat">' + s.warrantyVisits + ' زيارة ضمان</div></div>';
  h += '</div>';

  h += '<div class="grid2">';
  h += '<div class="card"><h3>💵 الإيرادات حسب النوع</h3>' + catTable(s.incomeByCat, s.collected, 'pos') + '</div>';
  h += '<div class="card"><h3>💸 المصروفات حسب التصنيف</h3>' + catTable(s.expenseByCat, s.expenses, 'neg') + '</div>';
  h += '</div>';

  var months = Object.keys(s.byMonth).sort();
  if(months.length > 1){
    h += '<div class="card" style="margin-bottom:14px;"><h3>📅 التفصيل الشهري</h3><table><thead><tr><th>الشهر</th><th class="n">الإيرادات</th><th class="n">المصروفات</th><th class="n">الصافي</th></tr></thead><tbody>';
    months.forEach(function(mk){
      var r = s.byMonth[mk], net = r.inc - r.exp;
      h += '<tr><td>' + esc(mk) + '</td><td class="n">' + fmt(r.inc) + '</td><td class="n">' + fmt(r.exp) + '</td><td class="n ' + (net >= 0 ? 'pos' : 'neg') + '">' + fmt(net) + '</td></tr>';
    });
    h += '<tr class="total"><td>الإجمالي</td><td class="n">' + fmt(s.collected) + '</td><td class="n">' + fmt(s.expenses) + '</td><td class="n ' + (s.net >= 0 ? 'pos' : 'neg') + '">' + fmt(s.net) + '</td></tr>';
    h += '</tbody></table></div>';
  }

  h += '<div class="card" style="margin-bottom:14px;"><h3>⚠️ الذمم المدينة غير المحصَّلة</h3>';
  if(s.receivables.length){
    h += '<table><thead><tr><th>العميل</th><th>تاريخ القيد</th><th>الحالة</th><th class="n">المتبقي</th></tr></thead><tbody>';
    s.receivables.forEach(function(x){
      h += '<tr><td>' + esc(x.party) + '</td><td>' + esc(x.date) + '</td><td>' + esc(x.status) + '</td><td class="n neg">' + fmt(x.remaining) + '</td></tr>';
    });
    h += '<tr class="total"><td colspan="3">الإجمالي</td><td class="n">' + fmt(s.receivableTotal) + '</td></tr></tbody></table>';
  } else {
    h += '<div class="empty">لا توجد مبالغ مستحقة في هذه الفترة ✅</div>';
  }
  h += '</div>';

  h += '<div class="note">الإيرادات = المبالغ المحصَّلة فعلياً فقط (المدفوع + دفعات المدفوع جزئياً). القيود الملغاة والمسوّاة مستبعدة. الفواتير الصادرة في الفترة: ' + fmtR(s.billed) + ' (' + s.incomeCount + ' قيد إيراد، ' + s.expenseCount + ' قيد مصروف). زيارات الضمان مفصولة عن الزيارات المكتملة ولا تدخل في متوسط الزيارة.</div>';

  document.getElementById('body').innerHTML = h;
  document.getElementById('btnXlsx').disabled = false;
  document.getElementById('btnPdf').disabled = false;
}

// ===== Excel =====
function exportExcel(){
  if(!lastReport || typeof XLSX === 'undefined'){ alert('مكتبة Excel غير متاحة'); return; }
  var s = lastReport.s, p = lastReport.p;
  var wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };

  var sum = [
    ['مؤسسة أطواد لصيانة المكيفات — الملخص المالي'],
    ['الفترة', rangeLabel(range)],
    ['تاريخ الإصدار', todayStr()],
    [],
    ['البند', 'الفترة الحالية', p ? 'الفترة السابقة' : ''],
    ['الإيرادات المحصَّلة', Math.round(s.collected), p ? Math.round(p.collected) : ''],
    ['المصروفات', Math.round(s.expenses), p ? Math.round(p.expenses) : ''],
    ['صافي الربح', Math.round(s.net), p ? Math.round(p.net) : ''],
    ['نقداً', Math.round(s.cash), p ? Math.round(p.cash) : ''],
    ['تحويل', Math.round(s.transfer), p ? Math.round(p.transfer) : ''],
    ['ذمم غير محصَّلة', Math.round(s.receivableTotal), p ? Math.round(p.receivableTotal) : ''],
    ['زيارات مكتملة', s.visits, p ? p.visits : ''],
    ['زيارات ضمان (إعادة عمل)', s.warrantyVisits, p ? p.warrantyVisits : ''],
    ['تكلفة الضمان', Math.round(s.warrantyCost), p ? Math.round(p.warrantyCost) : ''],
    ['متوسط إيراد الزيارة', Math.round(s.avgVisit), p ? Math.round(p.avgVisit) : ''],
    ['الفواتير الصادرة', Math.round(s.billed), p ? Math.round(p.billed) : ''],
    [],
    ['الإيرادات حسب النوع', 'المبلغ']
  ];
  Object.keys(s.incomeByCat).sort(function(a,b){ return s.incomeByCat[b] - s.incomeByCat[a]; }).forEach(function(k){ sum.push([k, Math.round(s.incomeByCat[k])]); });
  sum.push([]); sum.push(['المصروفات حسب التصنيف', 'المبلغ']);
  Object.keys(s.expenseByCat).sort(function(a,b){ return s.expenseByCat[b] - s.expenseByCat[a]; }).forEach(function(k){ sum.push([k, Math.round(s.expenseByCat[k])]); });
  var months = Object.keys(s.byMonth).sort();
  if(months.length > 1){
    sum.push([]); sum.push(['الشهر', 'الإيرادات', 'المصروفات', 'الصافي']);
    months.forEach(function(mk){ var r = s.byMonth[mk]; sum.push([mk, Math.round(r.inc), Math.round(r.exp), Math.round(r.inc - r.exp)]); });
  }
  var ws1 = XLSX.utils.aoa_to_sheet(sum);
  ws1['!cols'] = [{ wch: 30 }, { wch: 16 }, { wch: 16 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'الملخص');

  var incRows = [['التاريخ', 'العميل', 'الوصف', 'التصنيف', 'الطريقة', 'الحالة', 'المبلغ', 'المحصَّل', 'المتبقي']];
  var expRows = [['التاريخ', 'الجهة', 'الوصف', 'التصنيف', 'الطريقة', 'المبلغ']];
  TX.filter(function(e){ return isLive(e) && inRange(e.date || '', range); })
    .sort(function(a,b){ return String(a.date || '').localeCompare(String(b.date || '')); })
    .forEach(function(e){
      var amt = Math.round(parseFloat(e.amount) || 0);
      if(e.type === 'income'){
        var c = Math.round(collected(e));
        incRows.push([e.date || '', e.party || '', e.desc || '', e.category || '', e.method || '', normStatus(e.status), amt, c, amt - c]);
      } else if(e.type === 'expense'){
        expRows.push([e.date || '', e.party || '', e.desc || '', e.category || '', e.method || '', amt]);
      }
    });
  var ws2 = XLSX.utils.aoa_to_sheet(incRows); ws2['!cols'] = [{wch:12},{wch:20},{wch:34},{wch:12},{wch:10},{wch:14},{wch:10},{wch:10},{wch:10}];
  var ws3 = XLSX.utils.aoa_to_sheet(expRows); ws3['!cols'] = [{wch:12},{wch:20},{wch:34},{wch:14},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, 'الإيرادات');
  XLSX.utils.book_append_sheet(wb, ws3, 'المصروفات');

  var recRows = [['العميل', 'تاريخ القيد', 'الحالة', 'المتبقي']];
  s.receivables.forEach(function(x){ recRows.push([x.party, x.date, x.status, Math.round(x.remaining)]); });
  var ws4 = XLSX.utils.aoa_to_sheet(recRows); ws4['!cols'] = [{wch:24},{wch:12},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws4, 'الذمم');

  var name = 'Atwad-Financial-Summary-' + (range.from || 'all') + (range.to ? '_to_' + range.to : '') + '.xlsx';
  XLSX.writeFile(wb, name);
}

// ===== التحميل =====
function loadAll(){
  if(!db) return;
  var txP = db.ref('transactions').once('value').then(function(snap){
    var out = [];
    snap.forEach(function(c){ var v = c.val() || {}; v._fbKey = c.key; out.push(v); });
    TX = out;
  });
  var apP = db.ref('appointments').once('value').then(function(snap){
    var out = [];
    snap.forEach(function(c){
      var v = c.val() || {};
      var st = String(v.status || '').trim().toLowerCase();
      var done = (st === 'done' || st === 'completed' || st === 'complete' || st === 'finished' || st === 'closed' || st === 'مكتمل' || st === 'منجز' || st === 'تم' || st === 'منتهي');
      out.push({ date: v.date || '', status: done ? 'done' : st, warrantyRework: v.warrantyRework === true });
    });
    APPTS = out;
  }).catch(function(err){
    console.error('appointments load:', err);
    APPTS = [];
  });
  Promise.all([txP, apP]).then(function(){
    computeRange(period);
    render();
  }).catch(function(err){
    console.error('load:', err);
    document.getElementById('body').innerHTML = '<div class="empty">❌ تعذّر تحميل البيانات: ' + esc(err.message || err) + '</div>';
  });
}

window.addEventListener('atwad-admin-auth-ready', function(){
  try {
    db = firebase.database();
  } catch(e){
    console.error('Firebase database:', e);
    document.getElementById('body').innerHTML = '<div class="empty">❌ تعذّر الاتصال بقاعدة البيانات</div>';
    return;
  }
  loadAll();
});
