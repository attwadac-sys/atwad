<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أطواد — تسجيل العمليات المالية</title><style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
:root{
  --deep:#0C3B5E;--sky:#0EA5E9;--ice:#E8F4FD;--frost:#F0F9FF;
  --success:#10B981;--danger:#EF4444;--warning:#F59E0B;
  --slate:#334155;--mist:#94A3B8;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#F1F5F9;color:var(--slate);min-height:100vh;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--deep),#0e5fa8,var(--sky));padding:16px 20px;text-align:center;position:relative;}
.lang-btn{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);
  color:#fff;font-family:inherit;font-weight:800;font-size:12px;padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
.header h1{color:#fff;font-size:18px;font-weight:900;margin-bottom:2px;}
.header p{color:rgba(255,255,255,.75);font-size:12px;}

/* FORM CARD */
.card{background:#fff;border-radius:16px;margin:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.card-title{font-size:14px;font-weight:800;color:var(--deep);margin-bottom:16px;display:flex;align-items:center;gap:6px;}

/* نوع العملية */
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.type-btn{padding:14px;border:2px solid #E2E8F0;border-radius:12px;background:#fff;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .2s;color:var(--mist);}
.type-btn.income.sel{border-color:var(--success);background:#D1FAE5;color:var(--success);}
.type-btn.expense.sel{border-color:var(--danger);background:#FEE2E2;color:var(--danger);}
.type-btn:not(.sel):hover{border-color:var(--sky);color:var(--sky);}

/* حقول النموذج */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--slate);margin-bottom:6px;}
.form-group input,
.form-group select,
.form-group textarea{
  width:100%;padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:10px;
  font-family:'Tajawal',sans-serif;font-size:14px;color:var(--slate);
  background:var(--frost);outline:none;transition:border-color .2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:var(--sky);}
.form-group input[type="number"]{font-weight:700;font-size:18px;color:var(--deep);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.hidden{display:none;}

/* زر الحفظ */
.btn-save{
  width:100%;padding:14px;
  background:linear-gradient(90deg,var(--deep),var(--sky));
  color:#fff;border:none;border-radius:12px;
  font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;
  cursor:pointer;margin-top:4px;
  box-shadow:0 4px 14px rgba(14,165,233,.35);
  transition:opacity .2s;
}
.btn-save:hover{opacity:.9;}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}

/* رسالة النجاح */
.success-banner{
  display:none;background:#D1FAE5;border:1.5px solid #6EE7B7;
  border-radius:12px;padding:16px;margin:0 16px 16px;
  text-align:center;
}
.success-banner.show{display:block;}
.success-banner .icon{font-size:32px;margin-bottom:6px;}
.success-banner p{font-size:14px;font-weight:700;color:#065F46;}
.success-banner small{font-size:12px;color:#047857;margin-top:4px;display:block;}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--deep);color:#fff;padding:10px 22px;border-radius:10px;
  font-size:13px;font-weight:600;transition:transform .3s;z-index:999;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* سجل اليوم */
.today-list{margin-top:8px;}
.today-item{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--ice);font-size:13px;}
.today-item:last-child{border-bottom:none;}
.today-item .ti-desc{font-weight:600;color:var(--deep);}
.today-item .ti-meta{font-size:11px;color:var(--mist);margin-top:2px;}
.today-item .ti-amt{font-weight:800;white-space:nowrap;}
.ti-amt.in{color:var(--success);}
.ti-amt.out{color:var(--danger);}

@media(max-width:480px){
  .two-col{grid-template-columns:1fr;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="atwad-firebase.js"></script>
<script src="atwad-auth.js"></script>
</head>
<body>

<div class="header">
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
  <h1 data-i18n="title">💰 تسجيل العمليات المالية</h1>
  <p data-i18n="org">مؤسسة أطواد لصيانة المكيفات</p>
</div>

<!-- رسالة النجاح -->
<div class="success-banner" id="successBanner">
  <div class="icon">✅</div>
  <p id="successText" data-i18n="savedOk">تم حفظ العملية بنجاح</p>
  <small id="successDetail"></small>
</div>

<!-- النموذج -->
<div class="card">
  <div class="card-title" data-i18n="cardData">📋 بيانات العملية</div>

  <!-- نوع العملية -->
  <div class="type-row">
    <button class="type-btn income sel" id="btnIncome" onclick="selType('income')" data-i18n="income">💵 دخل</button>
    <button class="type-btn expense" id="btnExpense" onclick="selType('expense')" data-i18n="expense">💸 مصروف</button>
  </div>

  <!-- اسم الفني -->
  <div class="form-group">
    <label data-i18n="lblTech">👷 الفني</label>
    <select id="f_tech">
      <option value="أحمد" data-i18n="techAbrar">أحمد</option>
      <option value="شعيب" data-i18n="techShoib">شعيب</option>
      <option value="سهيل" data-i18n="techSuhail">سهيل</option>
    </select>
  </div>

  <!-- التاريخ والمبلغ -->
  <div class="two-col">
    <div class="form-group">
      <label data-i18n="lblDate">📅 التاريخ</label>
      <input type="date" id="f_date">
    </div>
    <div class="form-group">
      <label data-i18n="lblAmount">💵 المبلغ (ريال) *</label>
      <input type="number" id="f_amount" placeholder="0" min="0" inputmode="decimal">
    </div>
  </div>

  <!-- البيان -->
  <div class="form-group">
    <label data-i18n="lblDesc">📝 البيان / الوصف *</label>
    <input type="text" id="f_desc" placeholder="مثال: تنظيف مكيف — خالد الأحمدي" data-i18n-ph="phDesc">
  </div>

  <!-- اسم العميل — يظهر عند الدخل فقط -->
  <div class="form-group" id="partyGroup">
    <label data-i18n="lblParty">👤 اسم العميل</label>
    <input type="text" id="f_party" placeholder="اختياري" data-i18n-ph="phOptional">
  </div>

  <!-- فئة المصروف — تظهر عند المصروف فقط -->
  <div class="form-group hidden" id="categoryGroup">
    <label data-i18n="lblCat">🗂 فئة المصروف *</label>
    <select id="f_category">
      <option value="قطع غيار" data-i18n="c_parts">🔩 قطع غيار</option>
      <option value="وقود" data-i18n="c_fuel">⛽ وقود</option>
      <option value="طعام" data-i18n="c_food">🍽 طعام</option>
      <option value="إعلانات" data-i18n="c_ads">📢 إعلانات</option>
      <option value="صيانة سيارة" data-i18n="c_car">🚗 صيانة سيارة</option>
      <option value="رواتب" data-i18n="c_salary">👷 رواتب</option>
      <option value="إيجار" data-i18n="c_rent">🏠 إيجار</option>
      <option value="تأمين" data-i18n="c_ins">🛡 تأمين</option>
      <option value="أخرى" data-i18n="c_other">📦 أخرى</option>
    </select>
  </div>

  <!-- طريقة الدفع -->
  <div class="form-group">
    <label data-i18n="lblMethod">💳 طريقة الدفع</label>
    <select id="f_method" onchange="onMethodChange()">
      <option value="كاش" data-i18n="m_cash">💵 كاش</option>
      <option value="تحويل" data-i18n="m_transfer">🏦 تحويل بنكي</option>
      <option value="مدى" data-i18n="m_mada">💳 مدى</option>
      <option value="آجل" data-i18n="m_deferred">🕐 آجل — لم يُدفع بعد</option>
    </select>
    <div id="deferredNote" style="display:none;margin-top:9px;background:#FEF3C7;
         border:1.5px solid #FCD34D;color:#92400E;border-radius:10px;padding:10px 12px;
         font-size:12.5px;font-weight:700;line-height:1.8;">
      <span data-i18n-html="deferredNote">سيُسجَّل المبلغ <b>مستحقاً على العميل</b> ولن يُحتسب مقبوضاً.
      أبلغ الإدارة بموعد السداد المتفق عليه.</span>
    </div>
  </div>

  <button class="btn-save" id="btnSave" onclick="saveEntry()" data-i18n="saveBtn">✅ حفظ العملية</button>
</div>

<!-- سجل عمليات اليوم -->
<div class="card">
  <div class="card-title" data-i18n="todayOps">🗓 عمليات اليوم</div>
  <div class="today-list" id="todayList">
    <div style="text-align:center;padding:20px;color:var(--mist);font-size:13px;">لا توجد عمليات مسجلة اليوم بعد.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Firebase =====
var db = window.db; // من atwad-firebase.js — لا تهيئة محلية
/* ===== اللغة: عربي / English =====
   القيم المخزّنة (طريقة الدفع، الفئة، اسم الفني) تبقى عربية كما هي،
   فلا تتغير التقارير المالية — الترجمة للعرض فقط. */
var I18N = {
  ar: {
    title:'💰 تسجيل العمليات المالية', org:'مؤسسة أطواد لصيانة المكيفات', savedOk:'تم حفظ العملية بنجاح',
    cardData:'📋 بيانات العملية', income:'💵 دخل', expense:'💸 مصروف',
    lblTech:'👷 الفني', techAbrar:'أحمد', techShoib:'شعيب', techSuhail:'سهيل',
    lblDate:'📅 التاريخ', lblAmount:'💵 المبلغ (ريال) *', lblDesc:'📝 البيان / الوصف *',
    phDesc:'مثال: تنظيف مكيف — خالد الأحمدي', lblParty:'👤 اسم العميل', phOptional:'اختياري',
    lblCat:'🗂 فئة المصروف *', c_parts:'🔩 قطع غيار', c_fuel:'⛽ وقود', c_food:'🍽 طعام', c_ads:'📢 إعلانات',
    c_car:'🚗 صيانة سيارة', c_salary:'👷 رواتب', c_rent:'🏠 إيجار', c_ins:'🛡 تأمين', c_other:'📦 أخرى',
    lblMethod:'💳 طريقة الدفع', m_cash:'💵 كاش', m_transfer:'🏦 تحويل بنكي', m_mada:'💳 مدى',
    m_deferred:'🕐 آجل — لم يُدفع بعد',
    deferredNote:'سيُسجَّل المبلغ <b>مستحقاً على العميل</b> ولن يُحتسب مقبوضاً. أبلغ الإدارة بموعد السداد المتفق عليه.',
    saveBtn:'✅ حفظ العملية', todayOps:'🗓 عمليات اليوم', noOps:'لا توجد عمليات مسجلة اليوم بعد.',
    errAmount:'❌ أدخل مبلغاً صحيحاً', errDesc:'❌ أدخل البيان', errDate:'❌ اختر التاريخ',
    errFb:'❌ Firebase غير متاح', saving:'⏳ جاري الحفظ...',
    savedIncome:'تم حفظ الدخل بنجاح ✅', savedExpense:'تم حفظ المصروف بنجاح ✅',
    errSave:'❌ خطأ في الحفظ: ', uncollected:'لم يُحصَّل', currency:'﷼',
    mv_كاش:'كاش', 'mv_تحويل':'تحويل بنكي', 'mv_مدى':'مدى', 'mv_آجل':'آجل',
    other:'English'
  },
  en: {
    title:'💰 Record transactions', org:'Atwad AC Maintenance', savedOk:'Transaction saved',
    cardData:'📋 Transaction details', income:'💵 Income', expense:'💸 Expense',
    lblTech:'👷 Technician', techAbrar:'Ahmed', techShoib:'Shoaib', techSuhail:'Suhail',
    lblDate:'📅 Date', lblAmount:'💵 Amount (SAR) *', lblDesc:'📝 Description *',
    phDesc:'e.g. AC cleaning — Khalid Al-Ahmadi', lblParty:'👤 Customer name', phOptional:'Optional',
    lblCat:'🗂 Expense category *', c_parts:'🔩 Spare parts', c_fuel:'⛽ Fuel', c_food:'🍽 Food', c_ads:'📢 Advertising',
    c_car:'🚗 Vehicle maintenance', c_salary:'👷 Salaries', c_rent:'🏠 Rent', c_ins:'🛡 Insurance', c_other:'📦 Other',
    lblMethod:'💳 Payment method', m_cash:'💵 Cash', m_transfer:'🏦 Bank transfer', m_mada:'💳 Mada',
    m_deferred:'🕐 Deferred — not paid yet',
    deferredNote:'The amount will be recorded as <b>owed by the customer</b>, not as received. Tell the office the agreed payment date.',
    saveBtn:'✅ Save transaction', todayOps:"🗓 Today's transactions", noOps:'No transactions recorded today yet.',
    errAmount:'❌ Enter a valid amount', errDesc:'❌ Enter a description', errDate:'❌ Choose the date',
    errFb:'❌ Firebase unavailable', saving:'⏳ Saving...',
    savedIncome:'Income saved ✅', savedExpense:'Expense saved ✅',
    errSave:'❌ Save error: ', uncollected:'not collected', currency:'SAR',
    mv_كاش:'Cash', 'mv_تحويل':'Bank transfer', 'mv_مدى':'Mada', 'mv_آجل':'Deferred',
    other:'عربي'
  }
};
var LANG = 'ar';
try {
  var _sl = window.localStorage.getItem('atwad_tech_finance_lang');
  if(_sl === 'en' || _sl === 'ar') LANG = _sl;
} catch(err) { /* التخزين معطّل — نبدأ بالعربية */ }
function t(k){ return I18N[LANG][k]; }
function methodLabel(v){ var x = I18N[LANG]['mv_' + (v || 'كاش')]; return x || v || ''; }

function applyStaticLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === 'ar') ? 'rtl' : 'ltr';
  document.title = (LANG === 'ar') ? 'أطواد — مالية الفني' : 'Atwad — Technician finance';
  var n = document.querySelectorAll('[data-i18n]');
  for(var i = 0; i < n.length; i++){ var v = t(n[i].getAttribute('data-i18n')); if(v !== undefined) n[i].textContent = v; }
  var h = document.querySelectorAll('[data-i18n-html]');
  for(var j = 0; j < h.length; j++){ h[j].innerHTML = t(h[j].getAttribute('data-i18n-html')); }
  var p = document.querySelectorAll('[data-i18n-ph]');
  for(var k = 0; k < p.length; k++){ p[k].placeholder = t(p[k].getAttribute('data-i18n-ph')); }
  var lb = document.getElementById('langBtn'); if(lb) lb.textContent = t('other');
}
function toggleLang(){
  LANG = (LANG === 'ar') ? 'en' : 'ar';
  try { window.localStorage.setItem('atwad_tech_finance_lang', LANG); }
  catch(err) { /* تبقى اللغة لهذه الجلسة فقط */ }
  applyStaticLang();
  loadTodayEntries();
}
applyStaticLang();


// ===== مساعدات =====
function todayDate() {
  // توقيت السعودية Asia/Riyadh
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Riyadh'}).format(new Date());
}
function genId() { return 'TF' + Date.now().toString().slice(-8); }
function fmtAmt(n) { return Number(n).toLocaleString('ar-SA-u-ca-gregory'); }
function fmtDate(d) {
  try {
    return new Date(d + 'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory', {
      weekday:'short', month:'long', day:'numeric', year:'numeric'
    });
  } catch(e) { return d; }
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

// ===== حالة النموذج =====
var currentType = 'income';

function selType(type) {
  currentType = type;
  document.getElementById('btnIncome').classList.toggle('sel', type === 'income');
  document.getElementById('btnExpense').classList.toggle('sel', type === 'expense');
  document.getElementById('partyGroup').classList.toggle('hidden', type !== 'income');
  document.getElementById('categoryGroup').classList.toggle('hidden', type !== 'expense');
}

// ===== حفظ العملية =====
/** تنبيه الآجل يظهر فقط عند اختياره */
function onMethodChange(){
  var el = document.getElementById('deferredNote');
  if(el) el.style.display = (document.getElementById('f_method').value === 'آجل') ? 'block' : 'none';
}

function saveEntry() {
  var amount = parseFloat(document.getElementById('f_amount').value);
  var desc   = document.getElementById('f_desc').value.trim();
  var date   = document.getElementById('f_date').value;
  var tech   = document.getElementById('f_tech').value;
  var method = document.getElementById('f_method').value;
  var isDeferred = (method === 'آجل');

  if(!amount || amount <= 0) { showToast(t('errAmount')); return; }
  if(!desc)                  { showToast(t('errDesc'));          return; }
  if(!date)                  { showToast(t('errDate'));         return; }

  // ===== بنية transaction متوافقة مع atwad-finance.html =====
  var entry = {
    id:          genId(),
    type:        currentType,           // 'income' | 'expense'
    amount:      amount,
    desc:        desc,
    date:        date,                  // YYYY-MM-DD ميلادي
    method:      method,
    // الآجل يُسجَّل مستحقاً لا مقبوضاً، فلا يتضخم دخل اليوم بمبالغ لم تصل
    status:      isDeferred ? 'غير مدفوع' : 'مدفوع',
    paidAmount:  (currentType === 'income' && !isDeferred) ? amount : 0,
    payments:    (currentType === 'income' && !isDeferred)
      ? [{id:'P'+Date.now(), amount:amount, date:date, method:method, note:'تسجيل فني'}]
      : [],
    // حقول المصدر — لا تتعارض مع البيانات الحالية
    source:      'technician',
    createdBy:   tech,
    createdAt:   new Date().toISOString()
  };

  // حقل العميل (للدخل)
  if(currentType === 'income') {
    var party = document.getElementById('f_party').value.trim();
    if(party) entry.party = party;
    entry.category = 'خدمة';
  }

  // فئة المصروف
  if(currentType === 'expense') {
    entry.category = document.getElementById('f_category').value;
    entry.party    = '';
  }

  if(!db) { showToast(t('errFb')); return; }

  var btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = t('saving');

  db.ref('transactions').push(entry).then(function() {
    // نجاح
    document.getElementById('successText').textContent = currentType === 'income' ? t('savedIncome') : t('savedExpense');
    document.getElementById('successDetail').textContent =
      fmtAmt(amount) + ' ﷼ — ' + desc + ' — ' + fmtDate(date);
    document.getElementById('successBanner').classList.add('show');
    setTimeout(function(){
      document.getElementById('successBanner').classList.remove('show');
    }, 4000);

    resetForm();
    loadTodayEntries();
  }).catch(function(e) {
    showToast(t('errSave') + e.message);
  }).finally(function() {
    btn.disabled = false; btn.textContent = t('saveBtn');
  });
}

// ===== إعادة تعيين النموذج =====
function resetForm() {
  document.getElementById('f_amount').value = '';
  document.getElementById('f_desc').value   = '';
  document.getElementById('f_party').value  = '';
  document.getElementById('f_date').value   = todayDate();
  document.getElementById('f_method').value = 'كاش';
  onMethodChange();
  selType('income');
  document.getElementById('f_amount').focus();
}

// ===== سجل عمليات اليوم =====
function loadTodayEntries() {
  if(!db) return;
  var today = todayDate();
  var tech  = document.getElementById('f_tech').value;

  db.ref('transactions').orderByChild('date').equalTo(today).once('value', function(snap) {
    var items = [];
    snap.forEach(function(c) {
      var v = c.val();
      // عرض عمليات الفني الحالي فقط من مصدر technician
      if(v.source === 'technician' && v.createdBy === tech) {
        items.push(v);
      }
    });

    items.sort(function(a, b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });

    var list = document.getElementById('todayList');
    if(!items.length) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--mist);font-size:13px;">' + t('noOps') + '</div>';
      return;
    }

    list.innerHTML = items.map(function(v) {
      var isIncome = v.type === 'income';
      return '<div class="today-item">' +
        '<div>' +
          '<div class="ti-desc">' + (v.desc||'—') + '</div>' +
          '<div class="ti-meta">' + methodLabel(v.method) +
            (v.status === 'غير مدفوع' ? ' · <b style="color:#B45309;">' + t('uncollected') + '</b>' : '') +
            (v.party ? ' · ' + v.party : '') + '</div>' +
        '</div>' +
        '<div class="ti-amt ' + (isIncome?'in':'out') + '">' +
          (isIncome ? '+' : '-') + fmtAmt(v.amount) + ' ' + t('currency') +
        '</div>' +
      '</div>';
    }).join('');
  });
}
