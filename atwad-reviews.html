<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0C3B5E">
<title>مؤسسة أطواد — قيّم الخدمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --deep:#0C3B5E; --ink:#10202C; --muted:#56626C; --soft:#66727D; --line:#E3E6E9; --field:#D6DADF;
  --bg:#E9ECEF; --card:#FAFAF8; --tint:#EAF1F7; --sky-2:#9DBBD1; --star:#F0A92E; --star-off:#D6DADF;
  --ok:#1F7A4B; --ok-bg:#E3F3EA; --err:#9B2C2C; --err-bg:#FBECEC; --err-bd:#F0B8B8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Readex Pro',sans-serif;font-size:16px;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.card{width:100%;max-width:460px;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 2px 12px rgba(16,32,44,.08);margin:auto}
.head{background:var(--deep);color:#fff;padding:22px 22px 26px;display:flex;flex-direction:column;gap:12px}
.head-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:800 20px 'Noto Kufi Arabic',sans-serif}
.head-right{display:flex;align-items:center;gap:10px}
.tag{font-size:12px;color:var(--sky-2)}
.lang{height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:7px;cursor:pointer;font:500 12px 'IBM Plex Mono',monospace}
h1{font:700 26px/1.4 'Noto Kufi Arabic',sans-serif}
.sub{font-size:15px;color:#C7D9E7;line-height:1.7}
.body{padding:22px;display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:15px;font-weight:500}
.req{color:var(--err)}
.opt{font-weight:400;color:var(--soft);font-size:13px}
input,textarea{width:100%;font:400 17px 'Readex Pro',sans-serif;padding:14px;border:1.5px solid var(--field);border-radius:12px;color:var(--ink);background:#fff}
input{height:56px}
textarea{min-height:110px;resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:none;border-color:var(--deep)}
input.bad{border-color:var(--err)}
.stars{display:flex;justify-content:center;gap:6px;direction:ltr}
.star{width:52px;height:52px;border:0;background:none;font-size:44px;line-height:1;color:var(--star-off);cursor:pointer;padding:0;transition:transform .12s}
.star.on{color:var(--star)}
.star:active{transform:scale(.9)}
.stars.bad .star{color:#E9B8B8}
.star-lbl{text-align:center;min-height:24px;color:var(--deep);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--field);background:#fff;color:var(--ink);font:400 15px 'Readex Pro',sans-serif;cursor:pointer}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec .chip{border-radius:12px;height:52px;padding:0 6px}
.err{display:none;background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
.send{width:100%;height:60px;border:0;border-radius:14px;background:var(--deep);color:#fff;font:500 18px 'Readex Pro',sans-serif;cursor:pointer}
.send:hover{background:#134D78}
.send:disabled{background:#9AA4AD;cursor:not-allowed}
.done{display:none;padding:48px 22px 56px;flex-direction:column;align-items:center;text-align:center;gap:14px}
.done .tick{width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:34px}
.done h2{font:700 24px 'Noto Kufi Arabic',sans-serif}
.done p{color:var(--muted);line-height:1.8}
.done .again{margin-top:8px;height:48px;padding:0 20px;border:1px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);font:400 15px 'Readex Pro',sans-serif;cursor:pointer}
.foot{text-align:center;padding:14px;font-size:12px;color:var(--soft);border-top:1px solid #ECEEF0;background:#fff}
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="head-top">
      <span class="brand" data-t="brand">أطواد</span>
      <div class="head-right">
        <span class="tag" data-t="tagline">صيانة المكيفات</span>
        <button class="lang" id="langBtn" type="button" onclick="toggleLang()">EN</button>
      </div>
    </div>
    <h1 data-t="title">قيّم الخدمة</h1>
    <p class="sub" data-t="sub">رأيك يساعدنا نحسّن خدمتنا. لن يأخذ أكثر من دقيقة.</p>
  </div>

  <div class="body" id="formBody">
    <div class="err" id="err"></div>

    <div class="field">
      <span class="lbl"><span data-t="rateQ">كيف كانت الخدمة؟</span> <span class="req">*</span></span>
      <div class="stars" id="stars"></div>
      <div class="star-lbl" id="starLbl"></div>
    </div>

    <div class="field">
      <label class="lbl" for="customerName"><span data-t="name">الاسم</span> <span class="req">*</span></label>
      <input type="text" id="customerName" maxlength="100" autocomplete="name" data-ph="namePh" placeholder="اسمك">
    </div>

    <div class="field">
      <span class="lbl"><span data-t="service">نوع الخدمة</span> <span class="opt" data-t="optional">(اختياري)</span></span>
      <div class="chips" id="services"></div>
    </div>

    <div class="field">
      <span class="lbl" data-t="recQ">هل تنصح غيرك بأطواد؟</span>
      <div class="rec" id="rec"></div>
    </div>

    <div class="field">
      <label class="lbl" for="reviewText"><span data-t="comment">تعليقك</span> <span class="opt" data-t="optional">(اختياري)</span></label>
      <textarea id="reviewText" maxlength="1000" data-ph="commentPh" placeholder="ما الذي أعجبك؟ وما الذي نحسّنه؟"></textarea>
    </div>

    <button class="send" id="sendBtn" type="button" onclick="addReview()" data-t="send">إرسال التقييم</button>
  </div>

  <div class="done" id="done">
    <div class="tick">✓</div>
    <h2 data-t="thanks">شكراً لتقييمك</h2>
    <p data-t="thanksSub">وصلنا رأيك، وسنعمل على أن تكون زيارتك القادمة أفضل.</p>
    <button class="again" type="button" onclick="resetForm()" data-t="again">إرسال تقييم آخر</button>
  </div>

  <div class="foot" data-t="foot">مؤسسة أطواد لصيانة المكيفات — جدة</div>
</div>

<script>
firebase.initializeApp({ databaseURL: "https://atwad-booking-default-rtdb.firebaseio.com" });
var db = firebase.database();

// قيمة الخدمة (ar) هي ما يُحفظ في قاعدة البيانات كما كانت
var SERVICES = [
  {v:'تكييف', en:'Air conditioning'},
  {v:'تنظيف', en:'Cleaning'},
  {v:'صيانة', en:'Maintenance'},
  {v:'تركيب', en:'Installation'},
  {v:'فحص',   en:'Inspection'},
  {v:'أخرى',  en:'Other'}
];
var RECS = ['yes','maybe','no'];

var T = {
  ar: {
    brand:'أطواد', tagline:'صيانة المكيفات', other:'EN', pageTitle:'مؤسسة أطواد — قيّم الخدمة',
    title:'قيّم الخدمة', sub:'رأيك يساعدنا نحسّن خدمتنا. لن يأخذ أكثر من دقيقة.',
    rateQ:'كيف كانت الخدمة؟', starL:['','ضعيفة','مقبولة','جيدة','ممتازة','رائعة'],
    name:'الاسم', namePh:'اسمك', service:'نوع الخدمة', optional:'(اختياري)',
    recQ:'هل تنصح غيرك بأطواد؟', rec:{yes:'نعم', maybe:'ربما', no:'لا'},
    comment:'تعليقك', commentPh:'ما الذي أعجبك؟ وما الذي نحسّنه؟',
    send:'إرسال التقييم', sending:'جارٍ الإرسال…',
    eStars:'اختر التقييم بالنجوم.', eName:'اكتب اسمك من فضلك.', eSave:'تعذّر إرسال التقييم. تأكد من الاتصال وأعد المحاولة.',
    thanks:'شكراً لتقييمك', thanksSub:'وصلنا رأيك، وسنعمل على أن تكون زيارتك القادمة أفضل.', again:'إرسال تقييم آخر',
    foot:'مؤسسة أطواد لصيانة المكيفات — جدة'
  },
  en: {
    brand:'Atwad', tagline:'AC maintenance', other:'ع', pageTitle:'Atwad — Rate our service',
    title:'Rate our service', sub:'Your feedback helps us improve. It takes less than a minute.',
    rateQ:'How was the service?', starL:['','Poor','Fair','Good','Very good','Excellent'],
    name:'Name', namePh:'Your name', service:'Service type', optional:'(optional)',
    recQ:'Would you recommend Atwad?', rec:{yes:'Yes', maybe:'Maybe', no:'No'},
    comment:'Your comment', commentPh:'What did you like? What should we improve?',
    send:'Submit rating', sending:'Sending…',
    eStars:'Please choose a star rating.', eName:'Please enter your name.', eSave:'Could not send your rating. Check your connection and try again.',
    thanks:'Thanks for your rating', thanksSub:'We received your feedback and will work to make your next visit even better.', again:'Send another rating',
    foot:'Atwad AC Maintenance — Jeddah'
  }
};

function qs(name){
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
var lang = (qs('lang') === 'en') ? 'en' : 'ar';
var rating = 0, selectedService = '', recommend = 'yes', saving = false, errKey = '';
function t(k){ return T[lang][k]; }

function applyLang(){
  var h = document.documentElement;
  h.lang = lang; h.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t('pageTitle');
  document.getElementById('langBtn').textContent = t('other');
  var els = document.querySelectorAll('[data-t]');
  for(var i = 0; i < els.length; i++) els[i].textContent = t(els[i].getAttribute('data-t'));
  var ph = document.querySelectorAll('[data-ph]');
  for(var j = 0; j < ph.length; j++) ph[j].placeholder = t(ph[j].getAttribute('data-ph'));
  if(saving) document.getElementById('sendBtn').textContent = t('sending');
  if(errKey) document.getElementById('err').textContent = t(errKey);
  render();
}
function toggleLang(){ lang = lang === 'ar' ? 'en' : 'ar'; applyLang(); }

function render(){
  var s = '';
  for(var i = 1; i <= 5; i++) s += '<button type="button" class="star' + (i <= rating ? ' on' : '') + '" onclick="setRating(' + i + ')" aria-label="' + i + '">★</button>';
  document.getElementById('stars').innerHTML = s;
  document.getElementById('starLbl').textContent = t('starL')[rating];
  document.getElementById('services').innerHTML = SERVICES.map(function(x){
    return '<button type="button" class="chip' + (selectedService === x.v ? ' on' : '') + '" onclick="setService(\'' + x.v + '\')">' + (lang === 'ar' ? x.v : x.en) + '</button>';
  }).join('');
  document.getElementById('rec').innerHTML = RECS.map(function(r){
    return '<button type="button" class="chip' + (recommend === r ? ' on' : '') + '" onclick="setRec(\'' + r + '\')">' + t('rec')[r] + '</button>';
  }).join('');
}
function setRating(n){ rating = n; document.getElementById('stars').className = 'stars'; clearErr(); render(); }
function setService(v){ selectedService = selectedService === v ? '' : v; render(); }
function setRec(r){ recommend = r; render(); }

function showErr(key){
  errKey = key;
  var el = document.getElementById('err');
  el.textContent = t(key); el.style.display = 'block';
  window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + window.pageYOffset - 20), behavior:'smooth'});
}
function clearErr(){
  errKey = '';
  document.getElementById('err').style.display = 'none';
  document.getElementById('customerName').classList.remove('bad');
}

function addReview(){
  if(saving) return;
  clearErr();
  var name = document.getElementById('customerName').value.trim();
  var text = document.getElementById('reviewText').value.trim();
  if(!rating){ document.getElementById('stars').className = 'stars bad'; showErr('eStars'); return; }
  if(!name){ var n = document.getElementById('customerName'); n.classList.add('bad'); n.focus(); showErr('eName'); return; }

  var btn = document.getElementById('sendBtn');
  saving = true; btn.disabled = true; btn.textContent = t('sending');

  // نفس الحقول التي تقبلها قواعد Firebase
  db.ref('reviews').push({
    customerName: name.slice(0, 100),
    rating: rating,
    service: selectedService || '',
    text: text.slice(0, 1000),
    recommend: recommend,
    timestamp: Date.now()
  }).then(function(){
    saving = false; btn.disabled = false; btn.textContent = t('send');
    document.getElementById('formBody').style.display = 'none';
    document.getElementById('done').style.display = 'flex';
    window.scrollTo(0, 0);
  }).catch(function(){
    saving = false; btn.disabled = false; btn.textContent = t('send');
    showErr('eSave');
  });
}

function resetForm(){
  rating = 0; selectedService = ''; recommend = 'yes';
  document.getElementById('reviewText').value = '';
  document.getElementById('done').style.display = 'none';
  document.getElementById('formBody').style.display = 'flex';
  render();
}

// يمكن إرسال الرابط باسم العميل: atwad-reviews.html?name=محمد
(function(){ var n = qs('name'); if(n) document.getElementById('customerName').value = n.slice(0, 100); })();
applyLang();
</script>
</body>
</html>
