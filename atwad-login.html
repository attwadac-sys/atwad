<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>دخول الإدارة | مؤسسة أطواد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--deep:#0b2447;--blue:#0ea5e9;--muted:#64748b;--line:#dbe7f0}
    body{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#edfaff 0%,#f8fafc 55%,#e9f3ff 100%);font-family:'Tajawal',sans-serif;color:var(--deep)}
    .card{width:min(430px,100%);background:#fff;border:1px solid rgba(14,165,233,.16);border-radius:22px;box-shadow:0 24px 70px rgba(15,52,86,.14);padding:30px}
    .brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}
    .brand-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#dff6ff,#eef7ff);font-size:28px}
    h1{font-size:22px;font-weight:800}
    .subtitle{font-size:13px;color:var(--muted);margin-top:4px}
    .notice{padding:11px 13px;border-radius:11px;background:#eff9ff;border:1px solid #bae6fd;color:#075985;font-size:12px;line-height:1.7;margin-bottom:18px}
    label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px}
    input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:11px;padding:0 13px;font-family:inherit;font-size:15px;outline:none;direction:ltr;text-align:left}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
    .password-wrap{position:relative}
    .password-wrap input{padding-left:58px}
    .show-pass{position:absolute;left:8px;top:8px;height:32px;border:0;border-radius:8px;background:#f1f5f9;color:#475569;font-family:inherit;font-size:11px;font-weight:700;padding:0 9px;cursor:pointer}
    .submit{width:100%;height:48px;margin-top:20px;border:0;border-radius:11px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
    .submit:disabled{opacity:.65;cursor:wait}
    .message{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:12px;line-height:1.65}
    .message.error{display:block;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
    .message.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
    .reset{display:block;margin:14px auto 0;border:0;background:none;color:#0369a1;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
    .security{margin-top:20px;padding-top:16px;border-top:1px solid #eef2f7;color:#64748b;font-size:11px;line-height:1.7;text-align:center}
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-icon">❄️</div>
      <div>
        <h1>دخول إدارة أطواد</h1>
        <div class="subtitle">مؤسسة أطواد لصيانة المكيفات</div>
      </div>
    </div>
    <div class="notice">هذه الصفحة مخصصة لصاحب المؤسسة. سجّل الدخول بالحساب الإداري المسجل في Firebase.</div>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" value="attwadac@gmail.com" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <div class="password-wrap">
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="show-pass" type="button" id="showPass">إظهار</button>
      </div>
      <button class="submit" id="submitBtn" type="submit">دخول آمن</button>
      <div class="message" id="message" role="alert"></div>
      <button class="reset" id="resetBtn" type="button">نسيت كلمة المرور؟</button>
    </form>
    <div class="security">لا تُخزَّن كلمة المرور داخل ملفات الموقع. يتحقق Firebase من الحساب، ولا تسمح قواعد البيانات إلا بالـ UID الإداري المعتمد.</div>
  </main>

  <script>
  (function(){
    var ADMIN_UID = 'NU8g25megKefUOBQGvfkVtBOw802';
    var config = {
      apiKey: "AIzaSyAjq2PVCkAVYwqpIpKIGx01LkbCB3TmW6w",
      authDomain: "atwad-booking.firebaseapp.com",
      databaseURL: "https://atwad-booking-default-rtdb.firebaseio.com",
      projectId: "atwad-booking",
      storageBucket: "atwad-booking.firebasestorage.app",
      messagingSenderId: "110922546416",
      appId: "1:110922546416:web:d8cd48aa90f2d6ce9cd635"
    };
    firebase.initializeApp(config);
    var auth = firebase.auth();
    var form = document.getElementById('loginForm');
    var email = document.getElementById('email');
    var password = document.getElementById('password');
    var submitBtn = document.getElementById('submitBtn');
    var message = document.getElementById('message');

    function safeReturnPage() {
      var requested = new URLSearchParams(location.search).get('return') || 'atwad-appointments.html';
      return /^[a-zA-Z0-9._-]+\.html(?:[?#].*)?$/.test(requested) ? requested : 'atwad-appointments.html';
    }
    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message ' + type;
    }
    function friendlyError(err) {
      var code = err && err.code ? err.code : '';
      if(code === 'auth/wrong-password' || code === 'auth/invalid-login-credentials' || code === 'auth/user-not-found') return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
      if(code === 'auth/too-many-requests') return 'تم إيقاف المحاولات مؤقتًا بسبب تكرار الدخول. حاول لاحقًا أو أعد تعيين كلمة المرور.';
      if(code === 'auth/network-request-failed') return 'تعذر الاتصال. تحقق من الإنترنت ثم حاول مرة أخرى.';
      return 'تعذر تسجيل الدخول. تحقق من البيانات ثم حاول مرة أخرى.';
    }

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(){});
    auth.onAuthStateChanged(function(user){
      if(user && user.uid === ADMIN_UID) location.replace(safeReturnPage());
      else if(user) auth.signOut();
    });

    form.addEventListener('submit', function(e){
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق...';
      message.className = 'message';
      auth.signInWithEmailAndPassword(email.value.trim(), password.value)
        .then(function(result){
          if(!result.user || result.user.uid !== ADMIN_UID) {
            return auth.signOut().then(function(){ throw {code:'auth/not-authorized'}; });
          }
          showMessage('تم تسجيل الدخول بنجاح، جاري فتح النظام...', 'ok');
          location.replace(safeReturnPage());
        })
        .catch(function(err){
          showMessage(err && err.code === 'auth/not-authorized' ? 'هذا الحساب غير مصرح له بالدخول إلى نظام الإدارة.' : friendlyError(err), 'error');
        })
        .finally(function(){
          submitBtn.disabled = false;
          submitBtn.textContent = 'دخول آمن';
        });
    });

    document.getElementById('showPass').addEventListener('click', function(){
      var showing = password.type === 'text';
      password.type = showing ? 'password' : 'text';
      this.textContent = showing ? 'إظهار' : 'إخفاء';
    });

    document.getElementById('resetBtn').addEventListener('click', function(){
      var target = email.value.trim();
      if(!target) { showMessage('اكتب البريد الإلكتروني أولًا.', 'error'); return; }
      auth.sendPasswordResetEmail(target)
        .then(function(){ showMessage('تم إرسال رابط إعادة تعيين كلمة المرور إلى البريد الإلكتروني.', 'ok'); })
        .catch(function(err){ showMessage(friendlyError(err), 'error'); });
    });
  })();
  </script>
</body>
</html>
